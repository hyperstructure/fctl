[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "milkfloat"
description = "A vehicle-routing solver: time windows, capacities, driver breaks and re-planning while the vans are out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://milkfloat.dev/docs"
Source = "https://github.com/milkfloat/milkfloat"

[tool.maturin]
python-source = "python"
module-name = "milkfloat._milkfloat"
features = ["python"]

[dependency-groups]
dev = ["pytest>=8.4", "mkdocs-material>=9.6"]
