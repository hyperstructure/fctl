name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run maturin develop --release
      - run: uv run pytest tests/python

  bench:
    # The Solomon instances for 5 s each: a change that beats data/best.csv
    # has to update it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo run --release --example bench -- --instances solomon --seconds 5 --check data/best.csv

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run mkdocs build --strict
