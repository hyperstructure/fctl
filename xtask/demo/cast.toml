# The demo cast (.claude/skills/demo): who and what exists, and the sessions
# they ran, as `cargo xtask demo` loads them. Times are the story's, from the
# moment of the shots, a Tuesday at 09:10 (`today 08:52`, `yesterday 22:40`,
# `last thursday 14:00`, `-5mo`); the seed moves them to whenever it runs.
#
# Each session plays its transcript, `transcripts/<project>-<number>.toml`,
# and its project's repository starts as the files in `repos/<owner>/<name>`.

[instance]
name = "fctl"
password = "romanesco-demo"
github_app = "fctl-sh"
owner = { email = "ops@fctl.example", given = "fctl", family = "Ops" }

