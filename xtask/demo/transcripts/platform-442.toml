write = "src/routes/runs.rs"
content = """//! Each planning run, with its planner and what its routes come to, so that
//! the delivery team can compare a week of both planners (0141).

use super::{Route, plan::Planner};
use crate::depots::Depot;
use std::time::Duration;

pub async fn record(
    db: &crate::db::Db,
    depot: &Depot,
    planner: Planner,
    routes: &[Route],
    took: Duration,
) -> Result<(), crate::Error> {
    let stops: usize = routes.iter().map(|r| r.stops.len()).sum();
    let planner = match planner {
        Planner::Milkfloat => "milkfloat",
        Planner::Legacy => "legacy",
    };
    sqlx::query!(
        "INSERT INTO route_planner_runs (depot, planner, routes, stops, took_ms) VALUES ($1, $2, $3, $4, $5)",
        depot.id,
        planner,
        routes.len() as i32,
        stops as i32,
        took.as_millis() as i64,
    )
    .execute(db.pool())
    .await?;
    Ok(())
}
"""

