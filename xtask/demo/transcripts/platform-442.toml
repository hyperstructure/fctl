write = "src/routes/legacy.rs"
content = """//! The nearest-neighbour planner, from before milkfloat: each van takes the
//! nearest stop it hasn't been to until it's full, then goes back. Kept for
//! a week while the delivery team compares the two (`ROUTES_PLANNER`).

use super::{Route, Stop};
use crate::depots::Depot;
use milkfloat::Matrix;

/// Plans `depot`'s routes: each van takes the nearest stop it hasn't been
/// to until it's full, then goes back.
pub fn plan(depot: &Depot, stops: &[Stop], matrix: &Matrix) -> Vec<Route> {
    let mut left: Vec<usize> = (0..stops.len()).collect();
    let mut routes = Vec::new();
    for van in &depot.vans {
        let mut route = Route::new(van.id);
        let mut at = None;
        while let Some(next) = nearest(matrix, at, &left) {
            if route.load() + stops[next].boxes > van.capacity {
                break;
            }
            route.stops.push(stops[next].clone());
            left.retain(|&s| s != next);
            at = Some(next);
        }
        routes.push(route);
    }
    routes
}

/// The stop of `left` nearest to `from`, by travel time; from the depot,
/// the first.
fn nearest(matrix: &Matrix, from: Option<usize>, left: &[usize]) -> Option<usize> {
    left.iter()
        .copied()
        .min_by_key(|&s| from.map_or(0, |f| matrix.get(f, s)))
}
"""

[[turn.step]]
write = "src/routes/plan.rs"
content = """//! The vans' routes for a day: milkfloat's, or the nearest-neighbour planner's (`ROUTES_PLANNER`).

use super::{Route, Stop, legacy, runs};
use crate::{Error, db::Db, depots::Depot};
use chrono::{NaiveTime, Timelike};
use milkfloat::{Matrix, Problem, Solver, TimeWindow, Vehicle, Visit};
use std::time::{Duration, Instant};

/// Which planner plans the day's routes.
#[derive(Clone, Copy, Debug, PartialEq, Eq)]
pub enum Planner {
    Milkfloat,
    Legacy,
}

impl Planner {
    /// From `ROUTES_PLANNER`: `milkfloat`, else the nearest-neighbour planner.
    pub fn from_env() -> Self {
        match std::env::var("ROUTES_PLANNER").as_deref() {
            Ok("milkfloat") => Self::Milkfloat,
            _ => Self::Legacy,
        }
    }
}

/// Plans `depot`'s routes with `planner`, and records the run, so that the
/// delivery team can compare the two planners' days (`route_planner_runs`).
pub async fn plan(
    db: &Db,
    depot: &Depot,
    stops: &[Stop],
    matrix: &Matrix,
    planner: Planner,
) -> Result<Vec<Route>, Error> {
    let started = Instant::now();
    let routes = match planner {
        Planner::Milkfloat => with_milkfloat(depot, stops, matrix)?,
        Planner::Legacy => legacy::plan(depot, stops, matrix),
    };
    runs::record(db, depot, planner, &routes, started.elapsed()).await?;
    Ok(routes)
}

/// How long a stop takes: out of the van, to the door and back.
const SERVICE: Duration = Duration::from_secs(90);

/// How long milkfloat may search: planning starts after the 18:00 cutoff,
/// and the drivers' app wants the routes by 18:30.
const TIME_LIMIT: Duration = Duration::from_secs(20);

/// milkfloat's routes: each van a vehicle with its capacity and shift, each
/// stop a visit of a minute and a half within its delivery window.
fn with_milkfloat(depot: &Depot, stops: &[Stop], matrix: &Matrix) -> Result<Vec<Route>, Error> {
    let vehicles: Vec<Vehicle> = depot
        .vans
        .iter()
        .map(|v| {
            Vehicle::new(v.id)
                .capacity(v.capacity)
                .shift(seconds(v.shift_start), seconds(v.shift_end))
        })
        .collect();
    let visits: Vec<Visit> = stops
        .iter()
        .map(|s| Visit::new(s.id).demand(s.boxes).service(SERVICE).window(window(s)))
        .collect();
    let problem = Problem::new(vehicles, visits, matrix.clone());
    let solution = Solver::default()
        .time_limit(TIME_LIMIT)
        .solve(&problem)
        .map_err(|e| Error::Planning(e.to_string()))?;
    Ok(solution
        .routes()
        .map(|r| Route {
            van: r.vehicle(),
            stops: r.visits().map(|v| stops[v.index()].clone()).collect(),
        })
        .collect())
}

/// Seconds after midnight, as milkfloat takes shifts and time windows.
fn seconds(t: NaiveTime) -> i64 {
    i64::from(t.num_seconds_from_midnight())
}

/// A stop's delivery window, as milkfloat takes a time window.
fn window(stop: &Stop) -> TimeWindow {
    TimeWindow::new(seconds(stop.window_start.time()), seconds(stop.window_end.time()))
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn a_window_is_seconds_after_midnight() {
        let stop = Stop::test("2026-10-26T08:00:00Z", "2026-10-26T10:00:00Z");
        assert_eq!(window(&stop), TimeWindow::new(28_800, 36_000));
    }
}
"""

