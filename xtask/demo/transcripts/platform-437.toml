//! it once (PLAT-238).

mod common;

use common::TestDb;
use platform::billing::charge::charge_once;
use platform_test::FakeStripe;

#[tokio::test(flavor = "multi_thread", worker_threads = 4)]
async fn two_workers_charge_a_period_once() {
    let db = TestDb::isolated().await;
    // Slow enough for both workers to be inside `charge_once` at once.
    let stripe = FakeStripe::start().latency_ms(20).await;
    db.subscription("18342").insert().await;
    for round in 0..500 {
        let period = format!("race-{round}");
        let (a, b) = tokio::join!(
            charge_once(&db.platform(), "18342", &period),
            charge_once(&db.platform(), "18342", &period),
        );
        a.unwrap();
        b.unwrap();
        assert_eq!(stripe.charges_for_period("18342", &period).await, 1, "round {round}");
    }
}
"""

