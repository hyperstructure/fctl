    /// Claims the charge of `subscription` for `period`: true for the one
    /// caller whose insert wins, false for everyone after it.
    pub async fn claim_charge_key(&self, subscription: &str, period: &str) -> Result<bool, sqlx::Error> {
        let inserted = sqlx::query!(
            "INSERT INTO charge_keys (subscription, period) VALUES ($1, $2) ON CONFLICT DO NOTHING",
            subscription,
            period
        )
        .execute(&self.0)
        .await?;
        Ok(inserted.rows_affected() == 1)
    }

    /// Gives a claimed charge back, when Stripe didn't charge.
    pub async fn release_charge_key(&self, subscription: &str, period: &str) -> Result<(), sqlx::Error> {
        sqlx::query!(
            "DELETE FROM charge_keys WHERE subscription = $1 AND period = $2 AND charge_id IS NULL",
            subscription,
            period
        )
        .execute(&self.0)
        .await?;
        Ok(())
    }
}"""

