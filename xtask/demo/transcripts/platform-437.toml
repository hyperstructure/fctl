new = """/// What charging a subscription for a period came to.
#[derive(Debug, PartialEq, Eq)]
pub enum Charged {
    /// Charged now: the Stripe charge.
    Now(String),
    /// Charged before: nothing to do.
    Already,
}

/// Charges `subscription` for `period`, once. The invoice job calls it for
/// every subscription, and the `invoice.payment_failed` webhook for those
/// whose card was declined: both can come to one subscription at once.
pub async fn charge_once(db: &Db, subscription: &str, period: &str) -> Result<Charged, Error> {
    if db.charge_for(subscription, period).await?.is_some() {
        return Ok(Charged::Already);
    }
    let amount = amount_due(db, subscription, period).await?;
    let charge = stripe::charge(subscription, amount).await?;
    db.record_charge(subscription, period, &charge.id).await?;
    Ok(Charged::Now(charge.id))
}"""

