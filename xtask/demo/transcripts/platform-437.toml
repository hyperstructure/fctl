new = """    // Whoever inserts the key charges; anyone after finds it taken. Stripe
    // gets the key too, so a call retried after a timeout can't charge again.
    if !db.claim_charge_key(subscription, period).await? {
        return Ok(Charged::Already);
    }
    let key = format!("charge:{subscription}:{period}");
    let amount = amount_due(db, subscription, period).await?;
    let charge = match stripe::charge_with_key(subscription, amount, &key).await {
        Ok(charge) => charge,
        Err(e) => {
            // Declined, or Stripe unreachable: the next try may charge.
            db.release_charge_key(subscription, period).await?;
            return Err(e);
        }
    };
    db.record_charge(subscription, period, &charge.id).await?;
    Ok(Charged::Now(charge.id))"""

