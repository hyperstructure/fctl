"""

[[turn.step]]
write = "scripts/dump-restore.sh"
content = """#!/bin/sh
# Copies an environment's data into its Postgres 18 instance, for the
# dump_restore way. A person runs it, in a maintenance window, with the
# platform stopped (desired_count = 0): about 20 minutes for staging's 41 GB.
set -eu
env=${1:?usage: scripts/dump-restore.sh staging}
endpoint() {
  aws rds describe-db-instances --db-instance-identifier "$1" --query 'DBInstances[0].Endpoint.Address' --output text
}
old=$(endpoint "$env-platform")
new=$(endpoint "$env-platform-pg18")
echo "Dumping $old, restoring into $new"
pg_dump --host "$old" --username platform --format directory --jobs 8 --file "/tmp/$env.dump" platform
pg_restore --host "$new" --username platform --dbname platform --jobs 8 --exit-on-error "/tmp/$env.dump"
psql --host "$new" --username platform --dbname platform --command 'ANALYZE'
echo "Done: point the platform's database_url at $new, then start it again."
"""

