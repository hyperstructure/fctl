test.use({ viewport: { width: 390, height: 844 } });

test("a farm fills in next week and sends it", async ({ page }) => {
  await signInAs(page, "angsbacka@example.se");
  await page.goto("/harvest");
  await page.getByLabel("Morötter, kilo").fill("120");
  await page.getByRole("button", { name: "Skicka skörden" }).click();
  await expect(page.getByText("Skickat")).toBeVisible();
});

test("a farm only ever loads its own list", async ({ page, request }) => {
  await signInAs(page, "angsbacka@example.se");
  const other = await request.get("/api/harvest?farm=solgarden@example.se");
  expect(other.status()).toBe(404);
});
"""

