[[turn.step]]
write = "app/harvest/form.tsx"
content = """"use client";

import { useState, useTransition } from "react";
import { saveHarvest, type Line } from "./actions";

export function HarvestForm({ crops, send, sent }: { crops: (Line & { last: number })[]; send: string; sent: string }) {
  const [lines, setLines] = useState(crops);
  const [done, setDone] = useState(false);
  const [, start] = useTransition();
  const set = (crop: string, kg: number) => {
    const next = lines.map((l) => (l.crop === crop ? { ...l, kg } : l));
    setLines(next);
    start(() => saveHarvest(next, false));
  };
  return (
    <>
      <ul>
        {lines.map((l) => (
          <li key={l.crop} className="flex items-center gap-3 border-b border-stone-100 px-5 py-3">
            <span className="flex-1 font-semibold">
              {l.crop}
              <small className="block font-normal text-stone-500">{l.last} kg</small>
            </span>
            <input inputMode="numeric" value={l.kg} onChange={(e) => set(l.crop, Number(e.target.value) || 0)} aria-label={`${l.crop}, kilo`} className="h-10 w-20 rounded-lg border border-stone-300 text-right text-lg font-semibold" />
            <span className="w-6 text-sm text-stone-500">kg</span>
          </li>
        ))}
      </ul>
      <button onClick={() => start(async () => (await saveHarvest(lines, true), setDone(true)))} className="fixed inset-x-4 bottom-4 h-12 rounded-xl bg-[var(--green)] font-semibold text-white">
        {done ? sent : send}
      </button>
    </>
  );
}
"""

[[turn.step]]
write = "app/harvest/actions.ts"
content = """"use server";

import { farmEmail } from "@/lib/session";

export type Line = { crop: string; kg: number };

/** Saves a farm's list for next week as it types; `sent` once it presses the button. */
export async function saveHarvest(lines: Line[], sent: boolean) {
  const email = await farmEmail();
  if (!email) throw new Error("Not signed in");
  const res = await fetch(`${process.env.PLATFORM_URL}/v1/farms/by-email/${encodeURIComponent(email)}/harvest`, {
    method: "PUT",
    headers: { Authorization: `Bearer ${process.env.PLATFORM_API_TOKEN}`, "Content-Type": "application/json" },
    body: JSON.stringify({ week: "next", lines, sent }),
  });
  if (!res.ok) throw new Error(`Platform answered ${res.status}`);
}
"""

[[turn.step]]
write = "e2e/helpers.ts"
content = """import type { Page } from "@playwright/test";

/** Signs `page` in as the farm at `email`, through the link sign-in logs in development. */
export async function signInAs(page: Page, email: string) {
  const logged = new Promise<string>((resolve) =>
    page.on("console", (m) => m.text().includes("Inloggningslänk") && resolve(m.text().split(": ").pop() ?? "")),
  );
  await page.goto("/sign-in");
  await page.getByLabel("Gårdens e-postadress").fill(email);
  await page.getByRole("button", { name: "Skicka en länk" }).click();
  await page.goto(await logged);
}
"""

