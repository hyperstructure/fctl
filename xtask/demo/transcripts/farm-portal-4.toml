[[turn.step]]
write = "app/harvest/crops.ts"
content = """import { farmEmail } from "@/lib/session";

export type Crop = { crop: string; kg: number; last: number };

/** A week to start from until a farm has sent one. */
const SAMPLE: Crop[] = [
  { crop: "Morötter", kg: 120, last: 110 },
  { crop: "Rödbetor", kg: 80, last: 80 },
  { crop: "Grönkål", kg: 15, last: 14 },
  { crop: "Potatis", kg: 150, last: 150 },
  { crop: "Purjolök", kg: 25, last: 22 },
];

/** Next week's list as a farm starts it: what it sent last week, from Platform. */
export async function lastWeek(): Promise<Crop[]> {
  const email = await farmEmail();
  if (!email || !process.env.PLATFORM_API_TOKEN) return SAMPLE;
  const res = await fetch(`${process.env.PLATFORM_URL}/v1/farms/by-email/${encodeURIComponent(email)}/harvest?week=last`, {
    headers: { Authorization: `Bearer ${process.env.PLATFORM_API_TOKEN}` },
  });
  return res.ok ? ((await res.json()).lines as Crop[]) : SAMPLE;
}
"""

