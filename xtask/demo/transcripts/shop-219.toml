export type Farm = { id: string; name: string; place: string; blurb: string; photo_url: string };

/** What a box holds this week, as the platform has it, each item with its farm. */
export async function boxItems(slug: string): Promise<Item[]> {
  const res = await fetch(`${API}/boxes/${slug}/items?include=farm`, { next: { revalidate: 300 } });"""

