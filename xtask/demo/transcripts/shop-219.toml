// The box builder and the box's page list items the same way.
for (const path of ["/build/classic", "/boxes/classic"]) {
  test(`links each item to its farm on ${path}`, async ({ page }) => {
    await page.goto(path);
    const carrots = page.getByRole("listitem").filter({ hasText: "Carrots" });
    const farm = carrots.getByRole("link", { name: /Grown at Björkhaga/ });
    await expect(farm).toHaveAttribute("href", "/farms/bjorkhaga");
    await expect(farm.getByRole("img")).toBeVisible();
  });
}
"""

