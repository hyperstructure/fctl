import Link from "next/link";
import type { Locale } from "@/i18n/config";
import { t } from "@/i18n/t";
import type { Farm } from "@/lib/boxes";

/** The farm an item comes from: its photo, its name and the line it wrote about itself. */
export function FarmLink({ farm, locale }: { farm: Farm; locale: Locale }) {
  return (
    <Link href={`/farms/${farm.id}`} className="farm-link">
      <Image src={`${farm.photo_url}?w=64`} alt="" width={32} height={32} className="farm-link__photo" />
      <span className="farm-link__name">{t(locale, "box.grownAt", { farm: farm.name })}</span>
      <span className="farm-link__blurb">{farm.blurb}</span>
    </Link>
  );
}
"""

