//! kept in `webhook_dead_letters`.

use std::time::Duration;

/// Five tries: 30 s, 2 min, 8 min, 20 min, 40 min after the first.
pub const BACKOFF: [Duration; 5] = [
    Duration::from_secs(30),
    Duration::from_secs(120),
    Duration::from_secs(480),
    Duration::from_secs(1200),
    Duration::from_secs(2400),
];

/// When the next try is due, or `None` once the event is a dead letter.
pub fn next_try(attempts: usize) -> Option<Duration> {
    BACKOFF.get(attempts).copied()
}
"""

