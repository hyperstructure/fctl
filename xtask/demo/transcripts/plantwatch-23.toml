edit = "dashboard/src/db.rs"
old = """/// Takes the pot's latest reading as its dry (or wet) one.
pub fn calibrate(db: &Connection, board: &str, wet: bool) -> rusqlite::Result<()> {
    let column = if wet { "wet" } else { "dry" };
    db.execute(
        &format!(
            "INSERT INTO calibrations (board, {column}) \\
             VALUES (?1, (SELECT raw FROM readings WHERE board = ?1 ORDER BY at DESC LIMIT 1)) \\
             ON CONFLICT (board) DO UPDATE SET {column} = excluded.{column}"
        ),
        params![board],
    )?;
    Ok(())
}"""
new = """/// Takes the pot's latest reading as its dry (or wet) one, for the sensor
/// that took it.
pub fn calibrate(db: &Connection, board: &str, wet: bool) -> rusqlite::Result<()> {
    let column = if wet { "wet" } else { "dry" };
    db.execute(
        &format!(
            "INSERT INTO sensor_calibrations (board, sensor, {column}) \\
             SELECT board, sensor, raw FROM readings WHERE board = ?1 ORDER BY at DESC LIMIT 1 \\
             ON CONFLICT (board, sensor) DO UPDATE SET {column} = excluded.{column}"
        ),
        params![board],
    )?;
    Ok(())
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn pots_keep_their_analog_calibration() -> rusqlite::Result<()> {
        let path = std::env::temp_dir().join(format!("plantwatch-{}.db", std::process::id()));
        let before = Connection::open(&path)?;
        before.execute_batch(
            "CREATE TABLE readings (board TEXT NOT NULL, raw INTEGER NOT NULL, at INTEGER NOT NULL);
             CREATE TABLE calibrations (board TEXT PRIMARY KEY, dry INTEGER, wet INTEGER);
             INSERT INTO calibrations VALUES ('kitchen', 2980, 1510);",
        )?;
        drop(before);
        let db = open(&path.to_string_lossy())?;
        let kitchen = calibration(&db, "kitchen", "analog")?;
        assert_eq!(kitchen, Calibration { dry: Some(2980), wet: Some(1510) });
        assert_eq!(calibration(&db, "kitchen", "i2c")?, Calibration::default());
        std::fs::remove_file(&path).ok();
        Ok(())
    }
}"""

