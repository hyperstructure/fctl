[[turn.step]]
write = "firmware/src/soil_i2c.rs"
content = '''//! The capacitive soil sensor on I²C. It measures the soil's capacitance
//! itself, so its readings don't move as the board warms up, as the analog
//! probe's did. About 300 in dry soil, about 1000 just after watering.

use embassy_time::{Duration, Timer};
use embedded_hal_async::i2c::I2c as _;
use esp_hal::gpio::interconnect::PeripheralOutput;
use esp_hal::i2c::master::{Config, I2c};
use esp_hal::peripherals::I2C0;
use esp_println::println;

/// Its moisture register: module 0x0F, function 0x10.
const MOISTURE: [u8; 2] = [0x0F, 0x10];

/// Reads the sensor at `address`; `None`, with why on the serial console,
/// when it doesn't answer.
pub async fn read(
    i2c: I2C0<'static>,
    sda: impl PeripheralOutput<'static>,
    scl: impl PeripheralOutput<'static>,
    address: u8,
) -> Option<u16> {
    let mut bus = match I2c::new(i2c, Config::default()) {
        Ok(bus) => bus.with_sda(sda).with_scl(scl).into_async(),
        Err(e) => {
            println!("no I²C bus: {e:?}");
            return None;
        }
    };
    if let Err(e) = bus.write(address, &MOISTURE).await {
        println!("the soil sensor at {address:#04x} didn't answer: {e:?}");
        return None;
    }
    // It takes a moment to measure.
    Timer::after(Duration::from_millis(5)).await;
    let mut buf = [0u8; 2];
    bus.read(address, &mut buf).await.ok()?;
    Some(u16::from_be_bytes(buf))
}
'''

