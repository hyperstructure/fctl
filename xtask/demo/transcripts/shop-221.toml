pr = "Fix the delivery-day picker on Safari"
number = 1286
body = """On Safari on iOS, the delivery-day picker lost the chosen day when the keyboard closed.

The keyboard shrinks the visual viewport, which switches the picker between its grid and its list, and each switch remounted the days with the chosen day in them. The chosen day now lives above the two layouts, and the picker's read-only input has `inputMode="none"`, so that tapping a day doesn't open the keyboard either.

`e2e/day-picker.spec.ts` reproduces it in WebKit at an iPhone's size: it failed before the fix and passes after. The unit and e2e tests pass."""

[[turn.step]]
say = "Fixed in shop#1286: the picker keeps the chosen day when the keyboard closes, and a WebKit test with an iPhone's viewport covers it."

