content = """import { devices, expect, test } from "@playwright/test";

test.use({ ...devices["iPhone 15"] });

test("keeps the chosen day when the keyboard closes", async ({ page }) => {
  await page.goto("/checkout/delivery");
  await page.getByRole("option", { name: "Thu 29 Oct" }).tap();

  // Opening the keyboard shrinks the visual viewport: the picker shows its list.
  await page.getByLabel("Postcode").tap();
  await page.getByLabel("Postcode").fill("11432");
  await page.setViewportSize({ width: 393, height: 400 });
  await expect(page.locator(".day-picker__days--list")).toBeVisible();

  // Done closes it, and the grid comes back.
  await page.getByLabel("Postcode").blur();
  await page.setViewportSize({ width: 393, height: 852 });
  await page.waitForTimeout(500);
  await expect(page.getByLabel("Pick a delivery day")).toHaveValue("Thu 29 Oct");
});
"""

