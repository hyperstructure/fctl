write = "lib/session.ts"
content = """import { cookies } from "next/headers";

const SECRET = new TextEncoder().encode(process.env.SESSION_SECRET ?? "dev-only-secret");
const DAY = 24 * 60 * 60;

async function sign(payload: string): Promise<string> {
  const key = await crypto.subtle.importKey("raw", SECRET, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const mac = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(payload));
  return Buffer.from(mac).toString("base64url");
}

/** A link's token: the farm's email, when it expires and a nonce, signed. */
export async function linkToken(email: string, now = Date.now()): Promise<string> {
  const payload = Buffer.from(JSON.stringify({ email, exp: now + 15 * 60_000, n: crypto.randomUUID() })).toString("base64url");
  return `${payload}.${await sign(payload)}`;
}

/** The email a link's token is for, if it's genuine and hasn't expired; a used nonce is the caller's to refuse. */
export async function readLink(token: string, now = Date.now()): Promise<{ email: string; n: string } | null> {
  const [payload, mac] = token.split(".");
  if (!payload || !mac || mac !== (await sign(payload))) return null;
  const { email, exp, n } = JSON.parse(Buffer.from(payload, "base64url").toString());
  return exp > now ? { email, n } : null;
}

export async function signIn(email: string) {
  const value = `${Buffer.from(email).toString("base64url")}.${await sign(email)}`;
  (await cookies()).set("farm", value, { httpOnly: true, secure: true, sameSite: "lax", maxAge: 30 * DAY, path: "/" });
}

export async function farmEmail(): Promise<string | null> {
  const value = (await cookies()).get("farm")?.value;
  const [b64, mac] = value?.split(".") ?? [];
  if (!b64 || !mac) return null;
  const email = Buffer.from(b64, "base64url").toString();
  return mac === (await sign(email)) ? email : null;
}
"""

