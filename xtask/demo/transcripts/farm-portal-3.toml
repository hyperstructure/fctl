[[turn.step]]
write = "app/sign-in/actions.ts"
content = """"use server";

import { headers } from "next/headers";
import { redirect } from "next/navigation";
import { sendSignInLink } from "@/lib/email";
import { linkToken } from "@/lib/session";

const FARMS = (process.env.FARMS ?? "").split(",").map((e) => e.trim().toLowerCase());

export async function requestLink(form: FormData) {
  const email = String(form.get("email") ?? "").trim().toLowerCase();
  // The same answer whether or not it's a farm's, so the page tells nobody which addresses are.
  if (FARMS.includes(email)) {
    const origin = (await headers()).get("origin") ?? "https://farm.romanesco.farm";
    await sendSignInLink(email, `${origin}/sign-in/link?t=${await linkToken(email)}`);
  }
  redirect("/sign-in?sent=1");
}
"""

[[turn.step]]
write = "app/sign-in/link/route.ts"
content = """import { NextResponse, type NextRequest } from "next/server";
import { readLink, signIn } from "@/lib/session";
import { useNonce } from "@/lib/nonces";

export async function GET(req: NextRequest) {
  const link = await readLink(req.nextUrl.searchParams.get("t") ?? "");
  if (!link || !(await useNonce(link.n))) return NextResponse.redirect(new URL("/sign-in?expired=1", req.url));
  await signIn(link.email);
  return NextResponse.redirect(new URL("/", req.url));
}
"""

[[turn.step]]
write = "lib/nonces.ts"
content = """import { getCloudflareContext } from "@opennextjs/cloudflare";

const used = new Set<string>();

/** Marks a link's nonce used: false when it already was. In KV on Cloudflare, in memory in development. */
export async function useNonce(n: string): Promise<boolean> {
  const kv = (await getCloudflareContext({ async: true }).catch(() => null))?.env.NONCES as KVNamespace | undefined;
  if (!kv) return used.has(n) ? false : (used.add(n), true);
  if (await kv.get(n)) return false;
  await kv.put(n, "1", { expirationTtl: 20 * 60 });
  return true;
}
"""

[[turn.step]]
write = "middleware.ts"
content = """import { NextResponse, type NextRequest } from "next/server";

/** Pages are for signed-in farms; the sign-in pages and assets aren't. */
export function middleware(req: NextRequest) {
  if (!req.cookies.get("farm")) return NextResponse.redirect(new URL("/sign-in", req.url));
  return NextResponse.next();
}

export const config = { matcher: ["/((?!sign-in|_next|favicon.ico).*)"] };
"""

