content = """/** Sends a farm its sign-in link through Resend; without RESEND_API_KEY, logs it for development. */
export async function sendSignInLink(to: string, link: string) {
  const key = process.env.RESEND_API_KEY;
  if (!key) {
    console.info(`[dev] Inloggningslänk till ${to}: ${link}`);
    return;
  }
  const res = await fetch("https://api.resend.com/emails", {
    method: "POST",
    headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      from: "Romanesco <gardar@romanesco.farm>",
      to,
      subject: "Logga in på gårdsportalen",
      text: `Hej!\\n\\nTryck på länken för att logga in på Romanescos gårdsportal. Den fungerar en gång, i 15 minuter:\\n\\n${link}\\n`,
    }),
  });
  if (!res.ok) throw new Error(`Resend answered ${res.status}`);
}
"""

