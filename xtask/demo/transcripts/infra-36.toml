[[turn.step]]
write = "docs/runbooks/job-queue.md"
content = """# The job queue backs up

Alarms: `jobs-waiting`, more than 500 jobs waiting for 10 minutes, and `oldest-job`, the oldest waiting job older than 15 minutes. Both also fire when the platform stops publishing the queue's metrics, which looks the same from here: nothing is taking jobs.

The queue is the platform's `jobs` table: invoice runs, emails, Stripe events, route plans. Workers take jobs oldest first, and retry failed ones with backoff.

## First, look

1. The platform's dashboard, Jobs panel: which kinds of job wait. One kind piling up is usually one handler failing; every kind is usually the workers.
2. The workers' errors since the alarm: `aws logs tail /ecs/production-platform-worker --since 30m --filter-pattern ERROR`.
3. Whether the invoice run or a backfill is going: the 1st of the month and Monday mornings are busy.

## Make it stop hurting

- The workers are down or stuck: restart them with `aws ecs update-service --cluster production --service platform-worker --force-new-deployment`.
- Not enough workers for a busy hour: raise `worker_count` in `production/main.tf` with a pull request. For the next hour, set the service's desired count by hand in the console, and say so in #platform.
- One handler keeps failing: pause that kind with `scripts/jobs.sh pause KIND` until it's fixed, so that the others get through.

## After

Write down what happened in the incident log, and open an issue for whatever made the queue back up.
"""

