body = """Two alarms on the platform's job queue, in staging and production, paging through the on-call topic:

- `jobs-waiting`: more than 500 jobs waiting for 10 minutes (`jobs_waiting_max`).
- `oldest-job`: the oldest waiting job older than 15 minutes (`oldest_job_max_seconds`).

Both read the metrics the platform already publishes to `Romanesco/Platform`. Missing data counts as breaching, so workers that stop publishing page too. What to do when they fire is in `docs/runbooks/job-queue.md`.

`terraform plan -lock=false`: staging and production each add the two alarms, and change nothing else. Applying is for the apply workflow after the merge."""

