[[turn.step]]
write = "modules/monitoring/job_queue.tf"
content = """# The platform's job queue. The platform publishes how many jobs wait and
# how old the oldest one is, every minute, to Romanesco/Platform. Missing
# data breaches: workers that stop publishing are as bad as a queue that
# backs up.

resource "aws_cloudwatch_metric_alarm" "jobs_waiting" {
  alarm_name          = "${var.environment}-jobs-waiting"
  alarm_description   = "More than ${var.jobs_waiting_max} jobs have waited in the queue for 10 minutes. Runbook: docs/runbooks/job-queue.md"
  namespace           = "Romanesco/Platform"
  metric_name         = "JobsWaiting"
  dimensions          = { Environment = var.environment }
  statistic           = "Minimum"
  period              = 60
  evaluation_periods  = 10
  threshold           = var.jobs_waiting_max
  comparison_operator = "GreaterThanThreshold"
  treat_missing_data  = "breaching"
  alarm_actions       = [aws_sns_topic.oncall.arn]
  ok_actions          = [aws_sns_topic.oncall.arn]
}

resource "aws_cloudwatch_metric_alarm" "oldest_job" {
  alarm_name          = "${var.environment}-oldest-job"
  alarm_description   = "The oldest waiting job is older than ${var.oldest_job_max_seconds / 60} minutes. Runbook: docs/runbooks/job-queue.md"
  namespace           = "Romanesco/Platform"
  metric_name         = "OldestJobAgeSeconds"
  dimensions          = { Environment = var.environment }
  statistic           = "Maximum"
  period              = 60
  evaluation_periods  = 3
  threshold           = var.oldest_job_max_seconds
  comparison_operator = "GreaterThanThreshold"
  treat_missing_data  = "breaching"
  alarm_actions       = [aws_sns_topic.oncall.arn]
  ok_actions          = [aws_sns_topic.oncall.arn]
}
"""

