new = """//! The distance matrix between a day's stops: travel times by road, from
//! the routing service, for the planner. Built 16 rows at a time, and kept
//! for the day once its stops are final.

use super::Stop;
use futures::{StreamExt, TryStreamExt};
use milkfloat::Matrix;
use std::collections::HashMap;
use std::sync::{Arc, Mutex};

/// Rows asked for at once: the routing service takes 20 requests at a time
/// for a key, and the drivers' app needs a few of them.
const ROWS_AT_ONCE: usize = 16;
"""

[[turn.step]]
edit = "src/routes/matrix.rs"
old = """pub async fn build(router: &crate::routing::Client, stops: &[Stop]) -> Result<Matrix, crate::Error> {
    let mut matrix = Matrix::new(stops.len());
    for (i, from) in stops.iter().enumerate() {
        let row = router
            .travel_times(from.location, stops.iter().map(|s| s.location))
            .await?;
        matrix.set_row(i, &row);
    }
    Ok(matrix)
}
"""
new = """pub async fn build(router: &crate::routing::Client, stops: &[Stop]) -> Result<Matrix, crate::Error> {
    let rows: Vec<(usize, Vec<u32>)> = futures::stream::iter(stops.iter().enumerate())
        .map(|(i, from)| async move {
            let row = router
                .travel_times(from.location, stops.iter().map(|s| s.location))
                .await?;
            Ok::<_, crate::Error>((i, row))
        })
        .buffer_unordered(ROWS_AT_ONCE)
        .try_collect()
        .await?;
    let mut matrix = Matrix::new(stops.len());
    for (i, row) in rows {
        matrix.set_row(i, &row);
    }
    Ok(matrix)
}

/// The matrices of days whose stops are final, by depot and day.
static FINAL: Mutex<Option<HashMap<(String, chrono::NaiveDate), Arc<Matrix>>>> = Mutex::new(None);

/// `depot`'s matrix for `day`. Once the 18:00 cutoff the evening before has
/// passed, no stop changes, so it is built once and kept for the day.
pub async fn for_day(
    router: &crate::routing::Client,
    depot: &str,
    day: chrono::NaiveDate,
    stops: &[Stop],
) -> Result<Arc<Matrix>, crate::Error> {
    let key = (depot.to_owned(), day);
    let kept = FINAL.lock().ok().and_then(|days| days.as_ref()?.get(&key).cloned());
    if let Some(matrix) = kept {
        return Ok(matrix);
    }
    let matrix = Arc::new(build(router, stops).await?);
    if crate::cutoff::passed(day)
        && let Ok(mut days) = FINAL.lock()
    {
        let days = days.get_or_insert_with(HashMap::new);
        days.retain(|(_, d), _| *d >= day);
        days.insert(key, matrix.clone());
    }
    Ok(matrix)
}
"""

