content = """import { Body, Button, Container, Heading, Html, Preview, Text } from "@react-email/components";

/** A: a sentence and a button that signs the farm in to next week's list. */
export default function ReminderShort({ farm = "Ängsbacka gård", link = "https://farm.romanesco.farm/harvest" }) {
  return (
    <Html lang="sv">
      <Preview>Dags för nästa veckas skörd</Preview>
      <Body style={{ fontFamily: "Inter, sans-serif", background: "#ffffff" }}>
        <Container style={{ padding: "24px 26px" }}>
          <Heading as="h1">Hej {farm}!</Heading>
          <Text>
            Skicka in vad ni skördar nästa vecka senast <b>torsdag kl. 12</b>, så hinner vi planera lådorna.
          </Text>
          <Button href={link} style={{ background: "#2f6b3a", color: "#ffffff", padding: "11px 18px", borderRadius: 10 }}>
            Fyll i skörden
          </Button>
        </Container>
      </Body>
    </Html>
  );
}
"""

[[turn.step]]
write = "emails/reminder-last-week.tsx"
content = """import { Body, Button, Container, Heading, Html, Preview, Section, Text } from "@react-email/components";

type Line = { crop: string; amount: number; unit: string };

/** B: last week's list, and a button that sends the same again. */
export default function ReminderLastWeek({
  farm = "Ängsbacka gård",
  lines = [
    { crop: "Morötter", amount: 12, unit: "lådor" },
    { crop: "Rödbetor", amount: 8, unit: "lådor" },
    { crop: "Grönkål", amount: 40, unit: "knippen" },
    { crop: "Potatis", amount: 150, unit: "kg" },
  ] as Line[],
  same = "https://farm.romanesco.farm/harvest/same",
  change = "https://farm.romanesco.farm/harvest",
}) {
  return (
    <Html lang="sv">
      <Preview>Samma som förra veckan?</Preview>
      <Body style={{ fontFamily: "Inter, sans-serif", background: "#ffffff" }}>
        <Container style={{ padding: "24px 26px" }}>
          <Heading as="h1">Hej {farm}!</Heading>
          <Text>Förra veckan skickade ni:</Text>
          <Section>
            {lines.map((l) => (
              <Text key={l.crop} style={{ margin: 0, padding: "7px 0", borderBottom: "1px solid #efece3" }}>
                {l.crop} <span style={{ float: "right" }}>{l.amount} {l.unit}</span>
              </Text>
            ))}
          </Section>
          <Button href={same} style={{ background: "#2f6b3a", color: "#ffffff", padding: "11px 18px", borderRadius: 10 }}>
            Skicka samma
          </Button>{" "}
          <Button href={change} style={{ color: "#2f6b3a", border: "1px solid #c9d3c4", padding: "10px 16px", borderRadius: 10 }}>
            Ändra
          </Button>
        </Container>
      </Body>
    </Html>
  );
}
"""

