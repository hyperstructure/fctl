import { flush, outbox } from "./outbox";

jest.mock("@/src/api/client");
jest.mock("./doorstep", () => ({ forgetDoorstepPhoto: jest.fn() }));
jest.mock("@/src/storage", () => {
  const data = new Map<string, string>();
  return { storage: { getString: (k: string) => data.get(k), set: (k: string, v: string) => data.set(k, v) } };
});

const calls: string[] = [];

beforeEach(() => {
  calls.length = 0;
  jest.mocked(markStop).mockImplementation(async (id, status) => {
    calls.push(`mark ${id} ${status}`);
  });
  jest.mocked(uploadStopPhoto).mockImplementation(async (id, _file, kind) => {
    calls.push(`photo ${id} ${kind}`);
  });
});

test("a doorstep photo goes up after the stop is marked delivered", async () => {
  await outbox.push({ kind: "delivered", stopId: "s1", doorstepPhoto: "file:///documents/doorstep-s1.jpg" });
  expect(calls).toEqual(["mark s1 delivered", "photo s1 doorstep"]);
});

test("offline, the photo stays on the phone with its stop", async () => {
  jest.mocked(markStop).mockRejectedValueOnce(new Error("offline"));
  await outbox.push({ kind: "delivered", stopId: "s2", doorstepPhoto: "file:///documents/doorstep-s2.jpg" });
  expect(calls).toEqual([]);
  await flush();
  expect(calls).toEqual(["mark s2 delivered", "photo s2 doorstep"]);
});

test("a damaged box's photo still goes with its failed delivery", async () => {
  await outbox.push({ kind: "failed", stopId: "s3", reason: "Box crushed", photo: "file:///cache/damage.jpg" });
  expect(calls).toEqual(["mark s3 failed", "photo s3 damage"]);
});
"""

