[[turn.step]]
write = "src/delivery/doorstep.ts"
content = """import { File, Paths } from "expo-file-system";

/**
 * Moves a doorstep photo from the camera's cache to the app's documents,
 * where it stays until the outbox has sent it: the system may clear the
 * cache, and the photo mustn't leave the phone before the stop is delivered.
 */
export function keepDoorstepPhoto(stopId: string, uri: string): string {
  const kept = new File(Paths.document, `doorstep-${stopId}.jpg`);
  new File(uri).move(kept);
  return kept.uri;
}

/** Deletes a doorstep photo once the platform has it. */
export function forgetDoorstepPhoto(uri: string): void {
  const file = new File(uri);
  if (file.exists) file.delete();
}
"""

[[turn.step]]
write = "app/stop/[id]/doorstep.tsx"
content = """import { CameraView, useCameraPermissions } from "expo-camera";
import { router, useLocalSearchParams } from "expo-router";
import { useRef, useState } from "react";
import { Image, Pressable, StyleSheet, Text, View } from "react-native";
import { deliver } from "@/src/delivery/deliver";
import { keepDoorstepPhoto } from "@/src/delivery/doorstep";
import { log } from "@/src/log";
import { useRoute } from "@/src/route/useRoute";
import { colors, space } from "@/src/theme";

/** Nobody answered: a photo of the box at the door, and the stop is delivered. */
export default function DoorstepScreen() {
  const { id } = useLocalSearchParams<{ id: string }>();
  const stop = useRoute().find((s) => s.id === id);
  const camera = useRef<CameraView>(null);
  const [permission, ask] = useCameraPermissions();
  const [photo, setPhoto] = useState<string | null>(null);
  if (!stop) return null;

  if (!permission?.granted) {
    return (
      <View style={styles.screen}>
        <Text style={styles.text}>The app needs the camera to photograph the box at the door.</Text>
        <Pressable style={styles.button} onPress={ask}>
          <Text style={styles.label}>Allow the camera</Text>
        </Pressable>
      </View>
    );
  }

  const take = async () => {
    const shot = await camera.current?.takePictureAsync({ quality: 0.6 });
    if (shot) setPhoto(shot.uri);
  };

  const done = async () => {
    if (!photo) return;
    try {
      await deliver(stop, { doorstepPhoto: keepDoorstepPhoto(stop.id, photo) });
      router.dismissTo("/");
    } catch (error) {
      log.warn("couldn't keep the doorstep photo", { stop, error });
    }
  };

  if (photo) {
    return (
      <View style={styles.screen}>
        <Image source={{ uri: photo }} style={styles.preview} />
        <Pressable style={[styles.button, styles.primary]} onPress={done}>
          <Text style={styles.primaryLabel}>Delivered: left at the door</Text>
        </Pressable>
        <Pressable style={styles.button} onPress={() => setPhoto(null)}>
          <Text style={styles.label}>Take it again</Text>
        </Pressable>
      </View>
    );
  }

  return (
    <View style={styles.screen}>
      <CameraView ref={camera} style={styles.preview} facing="back" />
      <Text style={styles.text}>Get the box and the door in the picture, so the customer knows where to look.</Text>
      <Pressable style={[styles.button, styles.primary]} onPress={take}>
        <Text style={styles.primaryLabel}>Take the photo</Text>
      </Pressable>
    </View>
  );
}

const styles = StyleSheet.create({
  screen: { flex: 1, padding: space.lg, gap: space.md, backgroundColor: colors.surface },
  preview: { flex: 1, borderRadius: 16, overflow: "hidden" },
  text: { fontSize: 15, color: colors.ink3 },
  button: { borderRadius: 12, paddingVertical: space.lg, alignItems: "center", backgroundColor: colors.raised },
  primary: { backgroundColor: colors.green },
  primaryLabel: { fontSize: 17, fontWeight: "600", color: colors.surface },
  label: { fontSize: 17, color: colors.ink },
});
"""

