write = "src/slots/cache.rs"
content = """//! Delivery slots cached per postcode for ten minutes, and dropped when one
//! of their zone's routes changes: Postgres says so on `routes_changed`
//! (0138).

use super::{Slot, query};
use crate::db::Db;
use moka::future::Cache;
use std::sync::LazyLock;
use std::time::Duration;

/// How long a postcode's slots are kept: farms change their picking days
/// without any route changing, so not longer.
const FRESH: Duration = Duration::from_secs(10 * 60);

static SLOTS: LazyLock<Cache<String, Vec<Slot>>> = LazyLock::new(|| {
    Cache::builder()
        .max_capacity(20_000)
        .time_to_live(FRESH)
        .build()
});

/// A postcode's slots, from the cache while they're fresh. Requests for a
/// postcode that isn't cached share one query.
pub async fn slots(db: &Db, postcode: &str) -> Result<Vec<Slot>, crate::Error> {
    SLOTS
        .try_get_with(postcode.to_owned(), query(db, postcode))
        .await
        .map_err(|e| crate::Error::Slots(e.to_string()))
}

/// Drops the postcodes of each zone whose route changes, for as long as the
/// platform runs.
pub async fn listen(pool: sqlx::PgPool) -> Result<(), crate::Error> {
    let mut changes = sqlx::postgres::PgListener::connect_with(&pool).await?;
    changes.listen("routes_changed").await?;
    loop {
        let zone = changes.recv().await?;
        for postcode in crate::db::postcodes_of_zone(&pool, zone.payload()).await? {
            SLOTS.invalidate(&postcode).await;
        }
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    #[tokio::test]
    async fn a_second_ask_comes_from_the_cache() {
        let db = crate::db::test::with_slots("11635", 3).await;
        let first = slots(&db, "11635").await.unwrap();
        db.queries().reset();
        assert_eq!(slots(&db, "11635").await.unwrap().len(), first.len());
        assert_eq!(db.queries().count(), 0);
    }

    #[tokio::test]
    async fn a_route_change_drops_its_zone() {
        let db = crate::db::test::with_slots("11635", 3).await;
        slots(&db, "11635").await.unwrap();
        tokio::spawn(listen(db.pool().clone()));
        db.change_route("sto-south").await;
        tokio::time::sleep(Duration::from_millis(50)).await;
        assert!(SLOTS.get("11635").await.is_none());
    }
}
"""

