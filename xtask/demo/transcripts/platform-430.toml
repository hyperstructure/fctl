[[turn.step]]
write = "migrations/0138_delivery_slot_cache.sql"
content = """-- The slot cache drops a zone's postcodes when one of its routes changes
-- (platform#831).
CREATE FUNCTION notify_routes_changed() RETURNS trigger AS $$
BEGIN
    PERFORM pg_notify('routes_changed', NEW.zone);
    RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER routes_changed
    AFTER INSERT OR UPDATE OF load, capacity, zone ON routes
    FOR EACH ROW EXECUTE FUNCTION notify_routes_changed();
"""

