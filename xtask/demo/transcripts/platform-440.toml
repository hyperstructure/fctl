new = """pub fn rows(invoice: &Invoice) -> Vec<String> {
    invoice::vat(invoice)
        .into_iter()
        .map(|(rate, vat)| {
            let lines = invoice.lines.iter().filter(|l| l.vat_rate == rate);
            let total: i64 = lines.map(|l| l.amount).sum();
            let (sub, end) = (&invoice.subscription, invoice.period.end);
            format!("{sub},{end},{},{},{}", account(rate), ore(total), ore(vat))
        })
        .collect()
}

/// The BAS account for sales at `rate` percent VAT.
fn account(rate: u8) -> u16 {
    match rate {
        25 => 3001,
        6 => 3003,
        _ => 3002,
    }
}"""

