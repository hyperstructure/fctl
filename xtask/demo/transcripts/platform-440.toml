write = "src/billing/vat.rs"
content = """//! VAT by rate. Prices include it, so it is worked out from each rate's
//! total and rounded once per rate: the rates' VAT then adds up to what the
//! receipt shows, to the öre.

use super::invoice::Line;
use std::collections::BTreeMap;

/// The VAT the lines include, in öre, by rate in percent, lowest first.
pub fn by_rate(lines: &[Line]) -> Vec<(u8, i64)> {
    let mut totals: BTreeMap<u8, i64> = BTreeMap::new();
    for l in lines {
        *totals.entry(l.vat_rate).or_default() += l.amount;
    }
    totals
        .into_iter()
        .map(|(rate, total)| (rate, included(total, rate)))
        .collect()
}

/// The VAT a price of `total` öre includes at `rate` percent, to the
/// nearest öre, halves up.
fn included(total: i64, rate: u8) -> i64 {
    let rate = i64::from(rate);
    (total * rate * 2 + 100 + rate) / ((100 + rate) * 2)
}

#[cfg(test)]
mod tests {
    use super::*;

    fn line(amount: i64, vat_rate: u8) -> Line {
        Line { text: String::new(), amount, vat_rate }
    }

    #[test]
    fn a_box_with_flowers_has_two_rates() {
        // Kale at 35,00 kr and tulips at 149,00 kr.
        assert_eq!(by_rate(&[line(3500, 12), line(14900, 25)]), [(12, 375), (25, 2980)]);
    }

    #[test]
    fn each_rate_rounds_once() {
        // Seven items at 19,95 kr: 213,75 öre each would round to 214, seven
        // times; 13 965 öre in all include 1 496.
        let lines: Vec<Line> = (0..7).map(|_| line(1995, 12)).collect();
        assert_eq!(by_rate(&lines), [(12, 1496)]);
    }
}
"""

