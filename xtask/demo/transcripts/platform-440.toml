content = """//! A box with flowers on its invoice, its receipt and in the export.

use platform::billing::{invoice, receipt};
use platform::export::accounting;
use platform::BoxItem;

fn box_with_tulips() -> invoice::Invoice {
    let items = [BoxItem::test("Kale", 3500), BoxItem::test("Tulips", 14900).vat_rate(25)];
    invoice::invoice_for("sub_20517", &items)
}

#[test]
fn the_receipt_shows_each_rate() {
    let lines = receipt::lines(&box_with_tulips());
    assert!(lines.iter().any(|l| l.starts_with("Varav moms 12 %") && l.ends_with("3,75 kr")));
    assert!(lines.iter().any(|l| l.starts_with("Varav moms 25 %") && l.ends_with("29,80 kr")));
}

#[test]
fn the_export_books_flowers_to_3001() {
    let rows = accounting::rows(&box_with_tulips());
    assert_eq!(rows.len(), 2);
    assert!(rows[0].contains(",3002,35.00,3.75"));
    assert!(rows[1].contains(",3001,149.00,29.80"));
}
"""

