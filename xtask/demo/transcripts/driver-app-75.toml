[[turn.step]]
write = "plugins/with-live-activity.js"
content = """// Adds the NextStop widget extension, whose Live Activity shows the next
// stop on the lock screen, to the iOS project at prebuild: the native
// projects aren't in the repository (Continuous Native Generation).
const { withInfoPlist, withXcodeProject } = require("expo/config-plugins");
const fs = require("node:fs");
const path = require("node:path");

const TARGET = "NextStop";

module.exports = function withLiveActivity(config) {
  config = withInfoPlist(config, (c) => {
    c.modResults.NSSupportsLiveActivities = true;
    return c;
  });
  return withXcodeProject(config, (c) => {
    const project = c.modResults;
    if (project.pbxTargetByName(TARGET)) return c;
    fs.cpSync(
      path.join(c.modRequest.projectRoot, "targets", TARGET),
      path.join(c.modRequest.platformProjectRoot, TARGET),
      { recursive: true },
    );
    const target = project.addTarget(TARGET, "app_extension", TARGET, `${c.ios.bundleIdentifier}.${TARGET}`);
    project.addBuildPhase(["NextStopLiveActivity.swift", "NextStopBundle.swift"], "PBXSourcesBuildPhase", "Sources", target.uuid);
    project.addBuildPhase([], "PBXFrameworksBuildPhase", "Frameworks", target.uuid);
    for (const framework of ["WidgetKit.framework", "SwiftUI.framework", "ActivityKit.framework"]) {
      project.addFramework(framework, { target: target.uuid, link: true });
    }
    const configurations = project.pbxXCBuildConfigurationSection();
    for (const key of Object.keys(configurations)) {
      const settings = configurations[key].buildSettings;
      if (settings?.PRODUCT_NAME === `"${TARGET}"`) {
        settings.IPHONEOS_DEPLOYMENT_TARGET = "17.0";
        settings.SWIFT_VERSION = "5.0";
        settings.TARGETED_DEVICE_FAMILY = "1";
      }
    }
    return c;
  });
};
"""

