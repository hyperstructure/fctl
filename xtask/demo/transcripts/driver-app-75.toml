/// The round's next stop, as the app updates it. The app's module declares the same.
struct NextStopAttributes: ActivityAttributes {
  struct ContentState: Codable, Hashable {
    var address: String
    var window: String
    var sequence: Int
    var left: Int
  }
}

struct NextStopLiveActivity: Widget {
  var body: some WidgetConfiguration {
    ActivityConfiguration(for: NextStopAttributes.self) { context in
      // The lock screen.
      HStack(alignment: .top) {
        VStack(alignment: .leading, spacing: 4) {
          Text(context.state.address).font(.title3.weight(.semibold)).lineLimit(2)
          Text(context.state.window).font(.subheadline.monospacedDigit()).foregroundStyle(.secondary)
        }
        Spacer()
        VStack(alignment: .trailing, spacing: 2) {
          Text("\\(context.state.sequence)").font(.title2.monospacedDigit().weight(.bold))
          Text("\\(context.state.left) left").font(.caption).foregroundStyle(.secondary)
        }
      }
      .padding()
    } dynamicIsland: { context in
      DynamicIsland {
        DynamicIslandExpandedRegion(.leading) { Text(context.state.address).lineLimit(1) }
        DynamicIslandExpandedRegion(.trailing) { Text(context.state.window).monospacedDigit() }
      } compactLeading: {
        Text("\\(context.state.sequence)")
      } compactTrailing: {
        Text(context.state.window).monospacedDigit()
      } minimal: {
        Text("\\(context.state.sequence)")
      }
    }
  }
}
