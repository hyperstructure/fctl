write = "src/live/nextStopActivity.test.ts"
content = """import type { Stop } from "@/src/route/types";
import { nextStopState } from "./nextStopActivity";

const stop = (sequence: number, status: Stop["status"]): Stop => ({
  id: `s${sequence}`,
  sequence,
  address: `Folkungagatan ${sequence * 10}`,
  postcode: "11622",
  customerName: "",
  doorCode: null,
  notes: null,
  window: { from: "2026-10-23T07:00:00+02:00", to: "2026-10-23T09:00:00+02:00" },
  eta: "2026-10-23T07:40:00+02:00",
  boxes: 1,
  cold: false,
  status,
  toLogSafe: () => ({ id: `s${sequence}`, sequence, postcode: "11622", status }),
});

test("shows the first stop still to do", () => {
  expect(nextStopState([stop(1, "delivered"), stop(2, "pending"), stop(3, "pending")])).toMatchObject({
    address: "Folkungagatan 20",
    sequence: 2,
    left: 2,
  });
});

test("moves on past a failed delivery", () => {
  expect(nextStopState([stop(1, "failed"), stop(2, "pending")])?.sequence).toBe(2);
});

test("shows the window in 24-hour time", () => {
  expect(nextStopState([stop(1, "pending")])?.window).toBe("07:00–09:00");
});

test("shows nothing once every stop is done", () => {
  expect(nextStopState([stop(1, "delivered"), stop(2, "failed")])).toBeNull();
});
"""

