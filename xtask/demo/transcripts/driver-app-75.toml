[[turn.step]]
write = "modules/live-activity/ios/LiveActivityModule.swift"
content = """import ActivityKit
import ExpoModulesCore

/// The same as the widget extension's: ActivityKit matches them by their shape.
struct NextStopAttributes: ActivityAttributes {
  struct ContentState: Codable, Hashable {
    var address: String
    var window: String
    var sequence: Int
    var left: Int
  }
}

struct NextStopRecord: Record {
  @Field var address: String = ""
  @Field var window: String = ""
  @Field var sequence: Int = 0
  @Field var left: Int = 0

  var state: NextStopAttributes.ContentState {
    .init(address: address, window: window, sequence: sequence, left: left)
  }
}

public class LiveActivityModule: Module {
  public func definition() -> ModuleDefinition {
    Name("LiveActivity")

    AsyncFunction("start") { (next: NextStopRecord) -> String? in
      guard ActivityAuthorizationInfo().areActivitiesEnabled else { return nil }
      let activity = try Activity.request(attributes: NextStopAttributes(), content: .init(state: next.state, staleDate: nil))
      return activity.id
    }

    AsyncFunction("update") { (id: String, next: NextStopRecord) in
      guard let activity = Activity<NextStopAttributes>.activities.first(where: { $0.id == id }) else { return }
      await activity.update(.init(state: next.state, staleDate: nil))
    }

    AsyncFunction("end") { (id: String) in
      guard let activity = Activity<NextStopAttributes>.activities.first(where: { $0.id == id }) else { return }
      await activity.end(nil, dismissalPolicy: .immediate)
    }
  }
}
"""

[[turn.step]]
write = "modules/live-activity/index.ts"
content = """import { requireOptionalNativeModule } from "expo";
import { Platform } from "react-native";

/** What the lock screen shows of the next stop. */
export type NextStopState = { address: string; window: string; sequence: number; left: number };

type Native = {
  start(next: NextStopState): Promise<string | null>;
  update(id: string, next: NextStopState): Promise<void>;
  end(id: string): Promise<void>;
};

/** The Live Activity's native side, on iOS; none elsewhere. */
export const LiveActivity: Native | null = Platform.OS === "ios" ? requireOptionalNativeModule<Native>("LiveActivity") : null;
"""

[[turn.step]]
write = "src/live/nextStopActivity.ts"
content = """import type { NextStopState } from "@/modules/live-activity";
import type { Stop } from "@/src/route/types";
import { nextStop } from "@/src/route/useRoute";

const time = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });

/** What the lock screen shows for a route: its next stop, or nothing once every stop is done. */
export function nextStopState(stops: Stop[]): NextStopState | null {
  const next = nextStop(stops);
  if (!next) return null;
  return {
    address: next.address,
    window: `${time.format(new Date(next.window.from))}–${time.format(new Date(next.window.to))}`,
    sequence: next.sequence,
    left: stops.filter((s) => s.status === "pending").length,
  };
}
"""

[[turn.step]]
write = "src/live/useNextStopActivity.ts"
content = """import { useEffect, useRef } from "react";
import { LiveActivity } from "@/modules/live-activity";
import { log } from "@/src/log";
import type { Stop } from "@/src/route/types";
import { nextStopState } from "./nextStopActivity";

/** Keeps the lock screen's Live Activity on the route's next stop, and ends it after the last one. */
export function useNextStopActivity(stops: Stop[]) {
  const id = useRef<string | null>(null);
  const next = nextStopState(stops);
  const key = next ? `${next.sequence}:${next.left}` : "done";

  useEffect(() => {
    if (!LiveActivity) return;
    if (!next) {
      if (id.current) LiveActivity.end(id.current);
      id.current = null;
    } else if (id.current) {
      LiveActivity.update(id.current, next);
    } else {
      LiveActivity.start(next).then((started) => {
        id.current = started;
        const stop = stops.find((s) => s.sequence === next.sequence);
        log.info("Live Activity started", { stop });
      });
    }
    // The key says when the next stop changes.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [key]);
}
"""

