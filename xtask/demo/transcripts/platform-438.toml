[[turn.step]]
think = "The check and the insert sit on either side of the call to Stripe. Two workers can both find no charge, both call Stripe, and only then does the primary key stop the second insert: after the card was charged twice. That's Wednesday's race again, narrower. The replay passing proves little, since it depends on how fast Stripe answers. The key has to be claimed before the call, and Stripe's own idempotency key would cover a request that is retried after a timeout. The tests charge one after the other, so they can't see it."

