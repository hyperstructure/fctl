write = "bookings/tests/test_resets.py"
content = '''from datetime import timedelta

from django.contrib.auth.models import User
from django.core import mail
from django.test import TestCase
from django.utils import timezone

from bookings.models import Booking, Session, WallReset
from bookings.resets import close_for


class ResetTests(TestCase):
    def setUp(self):
        self.member = User.objects.create_user("maja", "maja@example.org", "climb-on")
        start = timezone.now() + timedelta(days=2)
        self.session = Session.objects.create(starts_at=start, ends_at=start + timedelta(hours=3))
        self.reset = WallReset.objects.create(
            starts_at=start - timedelta(hours=10), ends_at=start + timedelta(hours=14), note="New routes on the overhang"
        )

    def test_a_session_it_overlaps_cant_be_booked(self):
        self.client.force_login(self.member)
        self.client.post(f"/sessions/{self.session.id}/book")
        self.assertFalse(Booking.objects.filter(member=self.member).exists())

    def test_bookings_are_cancelled_and_members_told(self):
        booking = Booking.objects.create(session=self.session, member=self.member)
        with self.captureOnCommitCallbacks(execute=True):
            self.assertEqual(close_for(self.reset), 1)
        booking.refresh_from_db()
        self.assertIsNotNone(booking.cancelled_at)
        self.assertIn("the wall is being reset", mail.outbox[0].subject)

    def test_sessions_outside_it_stay_open(self):
        later = self.reset.ends_at + timedelta(hours=1)
        other = Session.objects.create(starts_at=later, ends_at=later + timedelta(hours=3))
        self.assertIsNone(other.reset)
'''

