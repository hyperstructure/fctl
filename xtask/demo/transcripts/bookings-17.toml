write = "bookings/resets.py"
content = '''from django.db import transaction
from django.utils import timezone

from .emails import send_reset
from .models import Booking


def close_for(reset):
    """Cancels the bookings of every session `reset` overlaps, and emails each
    member why, once the cancellations are saved. Returns how many it cancelled."""
    bookings = Booking.objects.filter(session__in=reset.sessions(), cancelled_at__isnull=True)
    count = 0
    with transaction.atomic():
        for booking in bookings.select_related("member", "session"):
            booking.cancelled_at = timezone.now()
            booking.save(update_fields=["cancelled_at"])
            transaction.on_commit(lambda b=booking: send_reset(b.member, b.session, reset))
            count += 1
    return count
'''

