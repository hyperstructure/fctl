pr = "Upgrade to Django 5.2"
number = 51
body = """Django 4.2 to 5.2, both long-term releases: 4.2's support is over, and 5.2's lasts until April 2028.

It hit three deprecations, each removed in 5.x and fixed here:

- `django.utils.timezone.utc` (gone in 5.0): `timezone.now()` in the cancel view.
- `STATICFILES_STORAGE` (gone in 5.1): the `STORAGES` setting, with whitenoise as before.
- `index_together` (gone in 5.1): `Meta.indexes` on `Booking`. The migration renames the existing index, so nothing is rebuilt.

The whole suite passes with warnings as errors (`python -Werror manage.py test`) on 4.2 and 5.2, `makemigrations --check` finds nothing missing, and `collectstatic` still builds. Deploying needs `pip install -r requirements.txt` and `python manage.py migrate`."""

