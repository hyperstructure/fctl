write = "tests/python/test_threads.py"
content = '''"""Solving from many threads at once, as free-threaded Python lets people do."""

from concurrent.futures import ThreadPoolExecutor

from milkfloat import TimeWindow, Vehicle, Visit, solve

HOUR = 3600
DEPOT = (59.3326, 18.0649)


def problem(seed):
    van = Vehicle("van", depot=DEPOT, shift=TimeWindow(6 * HOUR, 14 * HOUR), capacity=[40])
    visits = [
        Visit(f"v{i}", (59.30 + (i * seed % 17) * 0.004, 18.02 + (i % 5) * 0.015), service=120, demand=[2])
        for i in range(15)
    ]
    return [van], visits


def run(seed):
    vans, visits = problem(seed)
    return solve(vans, visits, seconds=0.5, seed=seed)


def test_solves_from_eight_threads_at_once():
    with ThreadPoolExecutor(max_workers=8) as pool:
        solutions = list(pool.map(run, range(1, 17)))
    assert all(not s.unassigned for s in solutions)
    assert len({id(s) for s in solutions}) == 16
'''

