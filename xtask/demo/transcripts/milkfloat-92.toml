pr = "Publish wheels for free-threaded Python 3.14"
number = 310
body = """cp314t wheels for Linux (x86_64 and aarch64), macOS (arm64) and Windows (x64), built with maturin beside the abi3 ones, as asked in #305.

- Free-threaded CPython has no limited API, so `abi3` is a feature now, which the abi3 job turns on; the free-threaded job builds without it.
- The module declares `gil_used = false`: the search runs with the GIL released and keeps no Python objects in statics. Without it, importing milkfloat on 3.14t turns the GIL back on.
- CI runs the Python tests on 3.14t too, and `tests/python/test_threads.py` solves from eight threads at once.

Tested on 3.14t and 3.12 locally, with warnings as errors on 3.14t. Closes #305."""

