think = "Two things stand in the way. Free-threaded CPython has no limited API, so the abi3-py310 feature on pyo3 can't be on for a cp314t build: it has to become a feature the abi3 job turns on, not a default. And the module has to declare `gil_used = false`, or importing it on 3.14t turns the GIL back on with a warning, which would defeat Kenji's thread pool. The search releases the GIL with `py.detach`, and the only static is the rayon pool in a OnceLock, which is Sync, so declaring it is honest."

