[[turn.step]]
write = "src/lib/postcodes.test.ts"
content = """import { describe, expect, it } from "vitest";
import cases from "../../tests/fixtures/postcodes.json";
import { normalize, zonesFor } from "./postcodes";

describe("normalize", () => {
  it.each([
    ["114 32", "11432"],
    ["11432", "11432"],
    [" 114 32 ", "11432"],
    ["1143", null],
    ["114 321", null],
    ["SE-114 32", null],
  ])("reads %j as %j", (typed, postcode) => {
    expect(normalize(typed)).toBe(postcode);
  });
});

// One row a postcode: the 14 on the borders between two zones are in two.
describe("zonesFor", () => {
  it.each(cases)("puts $postcode in $zones", ({ postcode, zones }) => {
    expect(zonesFor(postcode).map((z) => z.id)).toEqual(zones);
  });
});
"""

