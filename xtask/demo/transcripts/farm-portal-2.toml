deploys to https://farm.romanesco.farm once CI passes; every pull request
gets a preview of its own, whose link the Preview workflow keeps in a
comment on it. Both use the organization's `CLOUDFLARE_API_TOKEN`.

`npm run preview` builds the Worker and serves it locally, as Cloudflare
runs it."""

