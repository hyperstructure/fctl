[[turn.step]]
write = "lib/platform.ts"
content = """import recorded from "./platform.recorded.json";

export type OrderLine = { crop: string; kg: number; price_ore: number };
export type OrderDay = { date: string; lines: OrderLine[] };
export type Orders = { week: string; days: OrderDay[]; recorded: boolean };

/** A farm's orders for an ISO week, from Platform's API; a recorded week until PLATFORM_API_TOKEN is set. */
export async function ordersFor(farm: string, week: string): Promise<Orders | null> {
  const token = process.env.PLATFORM_API_TOKEN;
  if (!token) return { ...(recorded as Omit<Orders, "recorded">), recorded: true };
  const res = await fetch(`${process.env.PLATFORM_URL}/v1/farms/${encodeURIComponent(farm)}/orders?week=${week}`, {
    headers: { Authorization: `Bearer ${token}` },
    next: { revalidate: 300 },
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Platform answered ${res.status}`);
  return { ...(await res.json()), recorded: false };
}
"""

