[[turn.step]]
write = "app/orders/page.tsx"
content = """import { notFound } from "next/navigation";
import { t } from "@/lib/i18n";
import { ordersFor } from "@/lib/platform";
import { farmEmail } from "@/lib/session";

const kr = (ore: number) => (ore / 100).toLocaleString("sv-SE", { style: "currency", currency: "SEK", maximumFractionDigits: 0 });

/** This week's orders from the signed-in farm, by delivery day. */
export default async function Orders() {
  const farm = await farmEmail();
  const orders = farm ? await ordersFor(farm, "2026-W47") : null;
  if (!orders) notFound();
  const total = orders.days.flatMap((d) => d.lines).reduce((s, l) => s + l.price_ore, 0);
  return (
    <main className="mx-auto max-w-md px-5 pt-4 pb-16">
      <h1 className="text-2xl font-bold">{await t("orders.title")}</h1>
      {orders.recorded && <p className="mt-2 rounded-lg bg-amber-50 p-2.5 text-sm text-amber-900">{await t("orders.recorded")}</p>}
      {orders.days.map((d) => (
        <section key={d.date} className="mt-5">
          <h2 className="text-sm font-semibold text-stone-500">{new Date(d.date).toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long" })}</h2>
          <ul className="mt-1 divide-y divide-stone-100">
            {d.lines.map((l) => (
              <li key={l.crop} className="flex justify-between py-2">
                <span>{l.crop}</span>
                <span className="tabular-nums">{l.kg} kg · {kr(l.price_ore)}</span>
              </li>
            ))}
          </ul>
        </section>
      ))}
      <p className="mt-6 flex justify-between border-t border-stone-200 pt-3 font-semibold">
        <span>{await t("orders.total")}</span>
        <span className="tabular-nums">{kr(total)}</span>
      </p>
    </main>
  );
}
"""

