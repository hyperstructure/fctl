[[turn.step]]
write = "src/app/delivery/nearest.test.ts"
content = """import { describe, expect, it } from "vitest";
import { nearestFree } from "./nearest";
import type { Slot } from "./slots";

const day = (date: string, full = false): Slot => ({ date, label: date, full });
const week = [
  day("2026-11-02", true),
  day("2026-11-03"),
  day("2026-11-04", true),
  day("2026-11-05", true),
  day("2026-11-06"),
];

describe("nearestFree", () => {
  it("takes the next day when it's free", () => {
    expect(nearestFree(week, "2026-11-02")?.date).toBe("2026-11-03");
  });
  it("looks both ways, the later day first", () => {
    expect(nearestFree(week, "2026-11-04")?.date).toBe("2026-11-03");
    expect(nearestFree(week, "2026-11-05")?.date).toBe("2026-11-06");
  });
  it("finds none when every day is full", () => {
    expect(nearestFree(week.map((s) => ({ ...s, full: true })), "2026-11-04")).toBeNull();
  });
  it("finds none for a day it doesn't have", () => {
    expect(nearestFree(week, "2026-12-24")).toBeNull();
  });
  it("finds none in an empty week", () => {
    expect(nearestFree([], "2026-11-04")).toBeNull();
  });
});
"""

