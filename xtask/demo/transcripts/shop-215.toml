write = "src/app/delivery/nearest.ts"
content = """import type { Slot } from "./slots";

/**
 * The free day nearest to `date`: the later one when two are as near,
 * since the earlier may be past its order cutoff by the time someone picks it.
 */
export function nearestFree(slots: Slot[], date: string): Slot | null {
  const at = slots.findIndex((s) => s.date === date);
  if (at < 0) return null;
  for (let step = 1; step < slots.length; step++) {
    const later = slots[at + step];
    if (later && !later.full) return later;
    const earlier = slots[at - step];
    if (earlier && !earlier.full) return earlier;
  }
  return null;
}
"""

