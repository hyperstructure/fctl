type FullDayProps = { slot: Slot; slots: Slot[]; locale: Locale; onChoose: (date: string) => void };

/** Why a full day is full, and the nearest free day instead. */
function FullDay({ slot, slots, locale, onChoose }: FullDayProps) {
  const nearest = nearestFree(slots, slot.date);
  const why =
    slot.reason?.kind === "no_picking"
      ? t(locale, "delivery.full.farm", { farm: slot.reason.farm })
      : t(locale, "delivery.full.van");
  return (
