cat > tests/breaks.rs <<'MILKFLOAT_EOF'
//! Driver breaks: where a route makes room for them.

use milkfloat::insert::insert_break;
use milkfloat::model::{Break, Location, Stop, TimeWindow, Vehicle};
use milkfloat::route::Route;

const DEPOT: Location = Location { lat: 59.3326, lon: 18.0649 };
const HOUR: u32 = 3600;

/// A route from 06:00 to 14:00 that leaves a stop at each of `departures`.
fn route(departures: &[u32]) -> Route {
    let vehicle = Vehicle {
        id: "van".into(),
        depot: DEPOT,
        shift: TimeWindow::hard(6 * HOUR, 14 * HOUR),
        capacity: vec![40],
        breaks: Vec::new(),
    };
    let mut stops = vec![Stop::Depot(DEPOT)];
    stops.extend(departures.iter().map(|_| Stop::Depot(DEPOT)));
    let mut times = vec![6 * HOUR];
    times.extend_from_slice(departures);
    Route { vehicle, stops, arrivals: times.clone(), departures: times }
}

fn lunch(start: u32, end: u32) -> Break {
    Break { window: TimeWindow::hard(start, end), duration: HOUR / 2 }
}

#[test]
fn a_break_goes_after_the_first_stop_inside_its_window() {
    let mut r = route(&[7 * HOUR, 9 * HOUR, 11 * HOUR + 1800, 13 * HOUR]);
    insert_break(&mut r, &lunch(11 * HOUR, 12 * HOUR)).unwrap();
    assert!(matches!(r.stops[4], Stop::Break(_)));
}

#[test]
fn the_stops_after_a_break_move_on_by_its_length() {
    let mut r = route(&[7 * HOUR, 11 * HOUR + 600, 13 * HOUR]);
    insert_break(&mut r, &lunch(11 * HOUR, 12 * HOUR)).unwrap();
    assert_eq!(r.departures[3], 13 * HOUR + 1800);
}

#[test]
fn a_break_at_the_start_of_its_window_waits_for_nothing() {
    let mut r = route(&[11 * HOUR, 13 * HOUR]);
    insert_break(&mut r, &lunch(11 * HOUR, 12 * HOUR)).unwrap();
    assert!(matches!(r.stops[2], Stop::Break(_)));
}
