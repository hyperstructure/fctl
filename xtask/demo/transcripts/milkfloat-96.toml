pub fn insert_break(route: &mut Route, brk: &Break) -> Result<(), Infeasible> {
    // The latest it may start: inside its window, and over before the shift ends.
    let latest = brk.window.end.min(route.vehicle.shift.end.saturating_sub(brk.duration));
    let mut at = brk.window.start.max(route.vehicle.shift.start);
    while at <= latest {
        if let Some(i) = route.stops_after(at)
            && route.departures[i - 1] <= latest
        {
            route.stops.insert(i, Stop::Break(brk.clone()));
            route.delay_from(i, brk.duration);
            return Ok(());
        }
        let next = route.next_departure(at);
        if next == at {
            break;
        }
        at = next;
    }
    Err(Infeasible::Break { window: brk.window })
}"""

