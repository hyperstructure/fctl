duration = "3m"
result = "Noor chose the list per crop. Told #4 to build it and drop the grid; it merges once its checks pass. I wake when it ends its turn."

[[turn.step]]
bash = "fctl autopilot brief --only asks,sessions,plan"
description = "Read where things stand"
output = """# Autopilot of Farm portal

It's {{clock}}. You run the project Farm portal (farm-portal) for Noor Haddad. At most 3 of your sessions work at once; fctl wakes you at least every 2 hours, next in 2 hours.

