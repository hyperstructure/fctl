[[turn.step]]
write = "src/lib/reminders.ts"
content = '''import { type Bake, feedingTime } from "./plan";

export interface Reminder {
  bakeId: number;
  at: Date;
  title: string;
  body: string;
}

const HOUR = 3_600_000;

/** 21:00 the evening before the day of `bake`, in the server's time zone. */
function eveningBefore(bake: Bake): Date {
  const at = new Date(bake.readyAt);
  at.setDate(at.getDate() - 1);
  at.setHours(21, 0, 0, 0);
  return at;
}

const clock = (d: Date) => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

/**
 * The reminder for `bake`: at 21:00 the evening before its day, or an hour
 * before the feeding when the plan has the feeding earlier than that.
 */
export function reminderFor(bake: Bake): Reminder {
  const feed = feedingTime(bake);
  const evening = eveningBefore(bake);
  const early = new Date(feed.getTime() - HOUR);
  return {
    bakeId: bake.id,
    at: early < evening ? early : evening,
    title: `${bake.recipe} tomorrow`,
    body: `Feed the starter at ${clock(feed)}.`,
  };
}

/** The reminders due at `now` that haven't gone out yet. */
export function dueReminders(bakes: Bake[], now: Date, sent: Set<number>): Reminder[] {
  return bakes
    .filter((b) => !sent.has(b.id) && b.readyAt > now)
    .map(reminderFor)
    .filter((r) => r.at <= now);
}
'''

