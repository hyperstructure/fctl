[[turn.step]]
write = "src/lib/Reminders.svelte"
content = '''<script lang="ts">
  import { PUBLIC_VAPID_KEY } from "$env/static/public";

  let state = $state<"off" | "on" | "blocked" | "unsupported">("off");

  $effect(() => {
    if (!("PushManager" in window)) state = "unsupported";
    else if (Notification.permission === "denied") state = "blocked";
    else
      navigator.serviceWorker.ready
        .then((r) => r.pushManager.getSubscription())
        .then((s) => (state = s ? "on" : "off"));
  });

  async function turnOn() {
    // iOS asks only after a tap, and only in the app on the home screen.
    if ((await Notification.requestPermission()) !== "granted") return (state = "blocked");
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: PUBLIC_VAPID_KEY,
    });
    await fetch("/api/push", { method: "POST", body: JSON.stringify(subscription) });
    state = "on";
  }
</script>

<section>
  <h2>Reminders</h2>
  {#if state === "on"}
    <p>On: one comes at 21:00 the evening before each bake.</p>
  {:else if state === "blocked"}
    <p>Notifications are off for Sourdough in the phone's settings.</p>
  {:else if state === "unsupported"}
    <p>Add Sourdough to your home screen first: Safari shows reminders only there.</p>
  {:else}
    <button onclick={turnOn}>Remind me the evening before a bake</button>
  {/if}
</section>
'''

