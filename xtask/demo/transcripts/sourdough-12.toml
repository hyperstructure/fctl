write = "src/lib/reminders.test.ts"
content = '''import { describe, expect, it } from "vitest";
import { dueReminders, reminderFor } from "./reminders";

// Ready at 17:00 on Saturday: the starter is fed at 22:00 on Friday.
const bake = { id: 7, recipe: "Country loaf", readyAt: new Date("2026-03-14T17:00:00") };

describe("reminderFor", () => {
  it("comes at 21:00 the evening before", () => {
    const r = reminderFor(bake);
    expect(r.at).toEqual(new Date("2026-03-13T21:00:00"));
    expect(r.body).toBe("Feed the starter at 22:00.");
  });

  it("comes an hour before a feeding earlier than that", () => {
    const morning = { ...bake, readyAt: new Date("2026-03-14T09:00:00") };
    expect(reminderFor(morning).at).toEqual(new Date("2026-03-13T13:00:00"));
  });
});

describe("dueReminders", () => {
  it("sends nothing before its time", () => {
    expect(dueReminders([bake], new Date("2026-03-13T20:59:00"), new Set())).toEqual([]);
  });

  it("sends it once its time has come", () => {
    expect(dueReminders([bake], new Date("2026-03-13T21:00:00"), new Set())).toHaveLength(1);
  });

  it("never sends one twice", () => {
    expect(dueReminders([bake], new Date("2026-03-13T21:01:00"), new Set([7]))).toEqual([]);
  });
});
'''

