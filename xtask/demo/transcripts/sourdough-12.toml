write = "src/lib/server/push.ts"
content = '''import webpush from "web-push";
import { env } from "$env/dynamic/private";
import { db } from "./db";

webpush.setVapidDetails("mailto:noor@noorhaddad.se", env.VAPID_PUBLIC_KEY ?? "", env.VAPID_PRIVATE_KEY ?? "");

export interface Subscription {
  endpoint: string;
  keys: { p256dh: string; auth: string };
}

export function subscribe(s: Subscription) {
  db.prepare("INSERT OR REPLACE INTO push_subscriptions (endpoint, keys, created_at) VALUES (?, ?, ?)").run(
    s.endpoint,
    JSON.stringify(s.keys),
    new Date().toISOString(),
  );
}

export function unsubscribe(endpoint: string) {
  db.prepare("DELETE FROM push_subscriptions WHERE endpoint = ?").run(endpoint);
}

/** Sends `payload` to every subscribed phone, and forgets those the push service says are gone. */
export async function sendToAll(payload: { title: string; body: string; url: string }) {
  const rows = db.prepare("SELECT endpoint, keys FROM push_subscriptions").all() as { endpoint: string; keys: string }[];
  for (const row of rows) {
    try {
      await webpush.sendNotification({ endpoint: row.endpoint, keys: JSON.parse(row.keys) }, JSON.stringify(payload));
    } catch (e) {
      const status = (e as { statusCode?: number }).statusCode;
      if (status === 404 || status === 410) unsubscribe(row.endpoint);
      else throw e;
    }
  }
}
'''

[[turn.step]]
write = "src/lib/server/reminders.ts"
content = '''import { dueReminders } from "$lib/reminders";
import { db, upcomingBakes } from "./db";
import { sendToAll } from "./push";

/** Checks once a minute for reminders that are due, and sends each one once. */
export function startReminders() {
  const tick = async () => {
    const now = new Date();
    const rows = db.prepare("SELECT bake_id FROM reminders_sent").all() as { bake_id: number }[];
    const sent = new Set(rows.map((r) => r.bake_id));
    for (const r of dueReminders(upcomingBakes(now), now, sent)) {
      await sendToAll({ title: r.title, body: r.body, url: "/" });
      db.prepare("INSERT INTO reminders_sent (bake_id, sent_at) VALUES (?, ?)").run(r.bakeId, now.toISOString());
    }
  };
  setInterval(() => tick().catch((e) => console.error("sending reminders:", e)), 60_000);
}
'''

