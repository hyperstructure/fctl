tools = [
  { read = "src/i18n/config.ts" },
  { read = "src/lib/money.ts" },
  { grep = "sto-1", path = "src", output = "src/app/delivery/days.ts:9:const DEPOT = \"sto-1\";\nsrc/app/checkout/route.ts:27:  depot: \"sto-1\"," },
  { glob = "messages/*.json", output = "messages/en.json\nmessages/sv.json" },
]

[[turn.step]]
say = "The shop has `sv` and `en`. Prices go through `formatPrice`, which only knows SEK, and `sto-1` is hard-coded in two places where the depot should follow the locale. I'll add `da` first, then teach `formatPrice` kroner and pick the depot by locale."

[[turn.step]]
edit = "src/i18n/config.ts"
old = """export const locales = ["sv", "en"] as const;"""
new = """export const locales = ["sv", "en", "da"] as const;"""

