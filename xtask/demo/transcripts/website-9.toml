[[turn.step]]
write = "src/content/posts/agents-on-the-night-shift.md"
content = '''---
title: Agents on the night shift
summary: What we let coding agents do at Romanesco while we sleep, and what we still do ourselves.
draft: true
---

This is a talk I gave, written down for those who weren't there.

We deliver boxes of vegetables, bread and eggs from 40 farms around
Stockholm, to about 9,000 subscribers. Eight of us write the software: the
shop, the platform behind it and the app our drivers use. There's always
more work than evenings.

## The evening problem

Some work needs a quiet evening. A migration. Moving route planning to a new
solver. A framework upgrade. None of it is hard. It's long: two hours of
reading, two hours of careful typing, then waiting for CI.

For a year that work happened when someone gave up an evening. Usually me.

## A night

Now an agent does the long part. This is a real night from last month.

![A night: from a task at 22:10 to a merge at 08:05](/posts/night-shift/a-night.svg)

At 22:10 I write the task and start a session. By 22:55 there's a pull
request. Two minutes later a second agent has reviewed it and found two
problems. The first agent fixes both. At 23:23 the review is clean, and I go
to bed. At 07:50 I read it with my coffee. At 08:05 it's merged.

That's the whole trick. Everything else is about making that night go well.

## What goes in the evening

Not everything works. A task with a clear end does: "Cache the slot query and
show me the numbers before and after." "Make the checkout nicer" doesn't. If
I can't say how I'd check the result, I don't start it at night.

## A second pair of eyes

Every pull request is reviewed by another agent. It reads the diff fresh. It
doesn't approve anything, and it isn't a person. But it finds what a tired
person misses: a migration that would have locked the orders table for four
minutes, a time zone that was an hour off, but only in winter.

![The loop between you, the agent and the review agent](/posts/night-shift/the-loop.svg)

You write the task. The agent works and opens a pull request. The review
agent reads it, and its findings go back to the agent until there are none.
When the checks pass, a person reads it and merges. The person is the last
step. That won't change.

## Notes for the next agent

Agents start from nothing every time, so they leave notes for the next one.
"Never log a stop: it carries the door code." "Run `cargo sqlx prepare` after
you change a query, or CI fails." After a few months that's the best
onboarding document we have. New people read it too.

## The machines

People expect a data centre. It's two Macs in the office, two rented Linux
servers and my laptop. fctl runs the sessions on them, each in its own
sandbox. When a machine needs a kernel update, we drain it: the sessions on
it finish, and nobody notices.

## Limits

Plans have limits. A Pro plan can run out halfway through a long session,
and then the session waits until it resets. So the long nightly work runs on
the bigger plans, and we don't start everything at 02:00.

## What's still hard

Vague tasks. Anything visual: an agent can take a screenshot, but it has no
taste. Flaky tests: an agent will happily retry one until it passes, so we
told it not to.

The agents work nights. We still read everything in the morning.
'''

