write = "examples/bakery_round.py"
content = '''"""A bakery's morning round: one van, six customers, hard and soft windows.

docs/time-windows.md walks through it.
"""

from milkfloat import TimeWindow, Vehicle, Visit, solve


def at(clock: str) -> int:
    """Seconds after midnight, from "06:30"."""
    h, m = clock.split(":")
    return int(h) * 3600 + int(m) * 60


BAKERY = (59.3165, 18.0336)
van = Vehicle("van", depot=BAKERY, shift=TimeWindow(at("05:30"), at("10:00")), capacity=[24])

customers = [
    # Breakfast is at 06:30: the bread has to be there before.
    Visit("hotel", (59.3236, 18.0712), window=TimeWindow(at("06:00"), at("06:20")), service=480, demand=[5]),
    # The kitchen takes deliveries for 45 minutes, and not a minute later.
    Visit("school-kitchen", (59.3091, 18.0874), window=TimeWindow(at("06:30"), at("07:15")), service=600, demand=[6]),
    # Two cafés that open at 07:00 and want their bread before.
    Visit("cafe-harbour", (59.3189, 18.0941), window=TimeWindow(at("06:40"), at("07:00")), service=300, demand=[2]),
    Visit("cafe-north", (59.3302, 18.0573), window=TimeWindow(at("06:40"), at("07:00")), service=300, demand=[3]),
    # Soft windows: late costs something, but it's allowed.
    Visit("office", (59.3366, 18.0303), window=TimeWindow(at("07:15"), at("08:00"), penalty=2.0), service=300, demand=[4]),
    Visit("corner-shop", (59.3126, 18.0628), window=TimeWindow(at("06:00"), at("09:00"), penalty=0.5), service=240, demand=[3]),
]

solution = solve([van], customers, seconds=2, seed=1)
for route in solution.routes:
    print(" → ".join(f"{stop} {t // 3600:02d}:{t % 3600 // 60:02d}" for stop, t in zip(route.stops, route.arrivals)))
print("unassigned:", solution.unassigned or "none")
'''

