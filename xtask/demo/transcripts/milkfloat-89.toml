[[turn.step]]
write = "docs/time-windows.md"
content = '''# Time windows

A time window says when a delivery may start. A hotel that serves breakfast
at 06:30 wants its bread before; an office wants it once someone is there to
take it. milkfloat counts time in seconds after midnight in the depot's time
zone, so `TimeWindow(6 * 3600, 6 * 3600 + 1200)` is 06:00 to 06:20 wherever
the depot is.

## Hard and soft windows

A **hard** window can't be missed. milkfloat never starts a delivery after
its window ends: when no route can get there in time, the visit is left out
of every route and listed in `solution.unassigned`, for you to decide what to
do about it.

A **soft** window has a `penalty`: what each second late costs, in the units
of the distance a route drives (metres). milkfloat starts a delivery late
when that costs less than the detour that would make it on time:
`penalty=2.0` makes a minute late cost as much as 120 metres of driving.

Early is never late. A van that gets somewhere before its window opens
waits, and the wait counts towards the driver's shift.

| | Hard | Soft |
|---|---|---|
| Written | `TimeWindow(start, end)` | `TimeWindow(start, end, penalty=2.0)` |
| Starting after `end` | Never: unassigned instead | At `penalty` for each second late |
| Arriving before `start` | Waits | Waits |

## A bakery's morning round

One van leaves the bakery at 05:30 with 24 crates of bread for six
customers: four with hard windows and two with soft ones. The whole script
is [examples/bakery_round.py](https://github.com/milkfloat/milkfloat/blob/main/examples/bakery_round.py).

```python
van = Vehicle("van", depot=BAKERY, shift=TimeWindow(at("05:30"), at("10:00")), capacity=[24])

customers = [
    Visit("hotel", (59.3236, 18.0712), window=TimeWindow(at("06:00"), at("06:20")), service=480, demand=[5]),
    Visit("school-kitchen", (59.3091, 18.0874), window=TimeWindow(at("06:30"), at("07:15")), service=600, demand=[6]),
    Visit("cafe-harbour", (59.3189, 18.0941), window=TimeWindow(at("06:40"), at("07:00")), service=300, demand=[2]),
    Visit("cafe-north", (59.3302, 18.0573), window=TimeWindow(at("06:40"), at("07:00")), service=300, demand=[3]),
    Visit("office", (59.3366, 18.0303), window=TimeWindow(at("07:15"), at("08:00"), penalty=2.0), service=300, demand=[4]),
    Visit("corner-shop", (59.3126, 18.0628), window=TimeWindow(at("06:00"), at("09:00"), penalty=0.5), service=240, demand=[3]),
]
show(solve([van], customers, seconds=2, seed=1))
```

```text
depot 05:30 → hotel 06:00 → corner-shop 06:14 → school-kitchen 06:30 → cafe-harbour 06:44 → cafe-north 06:57 → office 07:15 → depot 07:31
unassigned: none
```

The times are when each delivery starts. What the solver did:

- The hotel comes first, since its window closes earliest. The van gets
  there at 05:45 and waits until 06:00.
- The corner shop's window is wide and soft, so it fills the gap before the
  school kitchen opens.
- Both cafés are served inside their 20 minutes, the harbour one first: it's
  on the way from the school.
- The office's window opens at 07:15, as the van gets there.

## When a window can't be met

Narrow the cafés' windows to 06:45–06:55 and one van can't serve both after
the school kitchen. With hard windows, milkfloat leaves one out rather than
arrive late:

```text
depot 05:30 → hotel 06:00 → corner-shop 06:14 → school-kitchen 06:30 → cafe-harbour 06:45 → office 07:15 → depot 07:31
unassigned: ['cafe-north']
```

Give `cafe-north` a soft window instead, `penalty=1.0`, and it's served at
06:59, four minutes late. Those 240 seconds cost 240 in the cost function:
far less than a second van, which is what serving it on time would take.

## Choosing windows

- Make a window as wide as the customer really allows. A window narrower than
  they need rules out routes that would have worked.
- Use hard windows for "we can't take it otherwise" and soft ones for "we'd
  like it then".
- A soft window's penalty is a price: compare it with what a detour costs.
  At `penalty=1.0`, a minute late is worth 60 metres of driving.
'''

