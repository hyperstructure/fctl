[[turn.step]]
bash = "git diff origin/main...HEAD -- Cargo.toml .github/workflows/wheels.yml"
description = "Read the build changes"
output = """--- a/Cargo.toml
+++ b/Cargo.toml
 [features]
 python = ["dep:pyo3"]
+# One wheel per platform for CPython 3.10 on, through the limited API.
+# Free-threaded CPython has no limited API, so its wheels leave this out.
+abi3 = ["python", "pyo3/abi3-py310"]

 [dependencies]
-pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py310"], optional = true }
+pyo3 = { version = "0.28.2", features = ["extension-module"], optional = true }
--- a/.github/workflows/wheels.yml
+++ b/.github/workflows/wheels.yml
-          args: --release --out dist
+          args: --release --out dist --features abi3
@@
+  free-threaded:
+    # cp314t wheels: free-threaded CPython can't load the abi3 ones.
+          args: --release --out dist -i python3.14t"""

[[turn.step]]
grep = "static|thread_local|GILOnceCell"
path = "src"
output = "src/solve/search.rs:12:static POOL: OnceLock<rayon::ThreadPool> = OnceLock::new();"

[[turn.step]]
think = "Moving abi3 to a feature changes what a source build produces: pip installing from the sdist now builds a version-specific extension instead of an abi3 one, which is fine, and pyproject's features stay [\"python\"]. The only static is a OnceLock of the rayon pool, which is Sync and holds no Python objects, so gil_used = false is safe. The thread test checks results come back whole from eight threads; it doesn't prove there's no race, but there's no shared mutable state to race on."

