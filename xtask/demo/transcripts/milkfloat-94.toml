[[turn.step]]
think = "The loop only ends by returning Ok. If the window ends before the shift starts, `at` starts past `window.end`, the condition never holds, and once `at` passes the last departure `next_departure` returns `at` itself: it spins forever. Same if no stop departs inside the window. insert_break returns Result but never Err, so the fix is to stop once `at` passes the window's end (or the shift's) and return Infeasible. The Rust side is otherwise careful: fits() and the stop names handle Stop::Break. Now the Python side."

