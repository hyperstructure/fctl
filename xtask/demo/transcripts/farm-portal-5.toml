write = "lib/i18n.ts"
content = """import { cookies, headers } from "next/headers";
import en from "@/messages/en.json";
import sv from "@/messages/sv.json";

const MESSAGES = { sv, en } as const;
export type Lang = keyof typeof MESSAGES;
export type Key = keyof typeof sv;

/** The farm's language: the `lang` cookie it chose, else its browser's, else Swedish. */
export async function lang(): Promise<Lang> {
  const chosen = (await cookies()).get("lang")?.value;
  if (chosen === "sv" || chosen === "en") return chosen;
  const accept = (await headers()).get("accept-language") ?? "";
  return /^en\\b/i.test(accept) ? "en" : "sv";
}

/** The string `key` in the farm's language. */
export async function t(key: Key): Promise<string> {
  return MESSAGES[await lang()][key];
}
"""

[[turn.step]]
write = "app/language-switch.tsx"
content = """import { cookies } from "next/headers";
import { lang, t } from "@/lib/i18n";

async function choose(form: FormData) {
  "use server";
  (await cookies()).set("lang", String(form.get("lang")), { maxAge: 365 * 24 * 60 * 60, path: "/" });
}

export async function LanguageSwitch() {
  const current = await lang();
  return (
    <form action={choose} className="mt-12 flex items-center justify-center gap-3 text-sm text-stone-500">
      <span>{await t("footer.language")}:</span>
      <button name="lang" value="sv" aria-pressed={current === "sv"} className="aria-pressed:font-semibold">Svenska</button>
      <button name="lang" value="en" aria-pressed={current === "en"} className="aria-pressed:font-semibold">English</button>
    </form>
  );
}
"""

