[[turn.step]]
write = "src/route/window.ts"
content = """import type { Stop } from "./types";

const time = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });

/** A stop's delivery window, such as "08:00–10:00", in the phone's time zone. */
export function formatWindow(window: Stop["window"]): string {
  return `${time.format(new Date(window.from))}–${time.format(new Date(window.to))}`;
}

/** Whether the van gets to a stop after its window closes, at the pace it's going. */
export function isLate(stop: Pick<Stop, "eta" | "window" | "status">): boolean {
  return stop.status === "pending" && new Date(stop.eta) > new Date(stop.window.to);
}
"""

[[turn.step]]
write = "src/route/window.test.ts"
content = """import { formatWindow, isLate } from "./window";

const window = { from: "2026-10-27T08:00:00+01:00", to: "2026-10-27T10:00:00+01:00" };

test("formats the window in 24-hour time", () => {
  expect(formatWindow(window)).toBe("08:00–10:00");
});

test("is late when the van gets there after the window closes", () => {
  expect(isLate({ status: "pending", window, eta: "2026-10-27T10:12:00+01:00" })).toBe(true);
});

test("isn't late inside the window", () => {
  expect(isLate({ status: "pending", window, eta: "2026-10-27T09:40:00+01:00" })).toBe(false);
});

test("isn't late once the stop is done", () => {
  expect(isLate({ status: "delivered", window, eta: "2026-10-27T10:12:00+01:00" })).toBe(false);
});
"""

