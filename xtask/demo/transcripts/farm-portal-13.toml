/** When our vans come for a farm's crates in an ISO week; recorded windows until PLATFORM_API_TOKEN is set. */
export async function pickupWindows(farm: string, week: string): Promise<PickupWindow[] | null> {
  const token = process.env.PLATFORM_API_TOKEN;
  if (!token) return (await import("./platform.windows.json")).default as PickupWindow[];
  const res = await fetch(`${process.env.PLATFORM_URL}/v1/farms/${encodeURIComponent(farm)}/pickup-windows?week=${week}`, {
    headers: { Authorization: `Bearer ${token}` },
    next: { revalidate: 300 },
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Platform answered ${res.status}`);
  return res.json();
}"""

