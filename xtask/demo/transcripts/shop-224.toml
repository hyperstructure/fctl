[[turn.step]]
write = "src/lib/skip-token.ts"
content = """import { createHmac, timingSafeEqual } from "node:crypto";

const secret = () => process.env.SKIP_LINK_SECRET ?? "";

/** A link token that skips one subscription's delivery on one date. */
export function signSkip(subscriptionId: string): string {
  const mac = createHmac("sha256", secret()).update(subscriptionId).digest("base64url");
  return `${subscriptionId}.${mac}`;
}

export function verifySkip(token: string): string | null {
  const [id, mac] = token.split(".");
  if (!id || !mac) return null;
  const expected = createHmac("sha256", secret()).update(id).digest("base64url");
  return timingSafeEqual(Buffer.from(mac), Buffer.from(expected)) ? id : null;
}
"""

[[turn.step]]
write = "src/app/skip/[token]/route.ts"
content = """import { NextResponse } from "next/server";
import { skipDelivery, nextDelivery } from "@/lib/platform";
import { verifySkip } from "@/lib/skip-token";

export async function GET(_req: Request, { params }: { params: { token: string } }) {
  const subscriptionId = verifySkip(params.token);
  if (!subscriptionId) return NextResponse.redirect(new URL("/skip/expired", _req.url));
  const delivery = await nextDelivery(subscriptionId);
  await skipDelivery(subscriptionId, delivery.date);
  return NextResponse.redirect(new URL(`/skip/done?date=${delivery.date}`, _req.url));
}
"""

