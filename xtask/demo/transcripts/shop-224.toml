new = """export function verifySkip(token: string, today: string): { id: string; date: string } | null {
  const [id, date, mac] = token.split(".");
  if (!id || !date || !mac || date < today) return null;
  const expected = createHmac("sha256", secret()).update(`${id}.${date}`).digest("base64url");
  return timingSafeEqual(Buffer.from(mac), Buffer.from(expected)) ? { id, date } : null;
}"""

