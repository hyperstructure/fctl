[[turn.step]]
write = "lib/units.ts"
content = """export type Unit = "crate" | "bunch" | "kg";

/** About how many kilos one crate or bunch of a crop is, as Romanesco's packers weigh them. */
const KG: Record<string, Partial<Record<Unit, number>>> = {
  Morötter: { crate: 10, bunch: 0.8 },
  Rödbetor: { crate: 10, bunch: 1 },
  Grönkål: { crate: 4, bunch: 0.375 },
  Potatis: { crate: 15 },
  Purjolök: { crate: 8, bunch: 0.85 },
  Spenat: { crate: 3 },
};

/** The units a farm can choose for `crop`: those we know its weight in, and kilos. */
export function unitsFor(crop: string): Unit[] {
  return [...(Object.keys(KG[crop] ?? {}) as Unit[]), "kg"];
}

/** What `amount` of `crop` in `unit` comes to in kilos, which Platform orders in. */
export function kilos(crop: string, amount: number, unit: Unit): number {
  return unit === "kg" ? amount : Math.round(amount * (KG[crop]?.[unit] ?? 1));
}
"""

[[turn.step]]
write = "app/harvest/crops.ts"
content = """import { farmEmail } from "@/lib/session";
import type { Unit } from "@/lib/units";

export type Crop = { crop: string; amount: number; unit: Unit; last: number };

/** A week to start from until a farm has sent one: kilos, until it chooses. */
const SAMPLE: Crop[] = [
  { crop: "Morötter", amount: 120, unit: "kg", last: 110 },
  { crop: "Rödbetor", amount: 80, unit: "kg", last: 80 },
  { crop: "Grönkål", amount: 15, unit: "kg", last: 14 },
  { crop: "Potatis", amount: 150, unit: "kg", last: 150 },
  { crop: "Purjolök", amount: 25, unit: "kg", last: 22 },
];

/** Next week's list as a farm starts it: what it sent last week, in the units it chose then. */
export async function lastWeek(): Promise<Crop[]> {
  const email = await farmEmail();
  if (!email || !process.env.PLATFORM_API_TOKEN) return SAMPLE;
  const res = await fetch(`${process.env.PLATFORM_URL}/v1/farms/by-email/${encodeURIComponent(email)}/harvest?week=last`, {
    headers: { Authorization: `Bearer ${process.env.PLATFORM_API_TOKEN}` },
  });
  if (!res.ok) return SAMPLE;
  // Lists sent before units were kilos.
  return ((await res.json()).lines as Crop[]).map((l) => ({ ...l, unit: l.unit ?? "kg" }));
}
"""

[[turn.step]]
write = "app/harvest/form.tsx"
content = """"use client";

import { useState, useTransition } from "react";
import { kilos, type Unit, unitsFor } from "@/lib/units";
import { saveHarvest } from "./actions";
import type { Crop } from "./crops";

export function HarvestForm({ crops, labels }: { crops: Crop[]; labels: Record<Unit | "send" | "sent" | "approx", string> }) {
  const [lines, setLines] = useState(crops);
  const [done, setDone] = useState(false);
  const [, start] = useTransition();
  const change = (crop: string, part: Partial<Crop>) => {
    const next = lines.map((l) => (l.crop === crop ? { ...l, ...part } : l));
    setLines(next);
    start(() => saveHarvest(next, false));
  };
  return (
    <>
      <ul>
        {lines.map((l) => (
          <li key={l.crop} className="flex items-center gap-2.5 border-b border-stone-100 px-5 py-2.5">
            <span className="flex-1 font-semibold">
              {l.crop}
              {l.unit !== "kg" && <small className="block font-normal text-stone-500">{labels.approx.replace("{kg}", String(kilos(l.crop, l.amount, l.unit)))}</small>}
            </span>
            <input inputMode="numeric" value={l.amount} onChange={(e) => change(l.crop, { amount: Number(e.target.value) || 0 })} aria-label={`${l.crop}, ${labels[l.unit]}`} className="h-9 w-16 rounded-lg border border-stone-300 text-right font-semibold" />
            <div role="radiogroup" aria-label={`${l.crop}: enhet`} className="flex overflow-hidden rounded-lg border border-stone-300 text-xs">
              {unitsFor(l.crop).map((u) => (
                <button key={u} role="radio" aria-checked={l.unit === u} onClick={() => change(l.crop, { unit: u })} className="px-2 py-2 aria-checked:bg-[var(--green)] aria-checked:font-semibold aria-checked:text-white">
                  {labels[u]}
                </button>
              ))}
            </div>
          </li>
        ))}
      </ul>
      <button onClick={() => start(async () => (await saveHarvest(lines, true), setDone(true)))} className="fixed inset-x-4 bottom-4 h-12 rounded-xl bg-[var(--green)] font-semibold text-white">
        {done ? labels.sent : labels.send}
      </button>
    </>
  );
}
"""

