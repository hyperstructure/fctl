[[turn]]
duration = "19m"
result = """A plan for gift boxes for companies, and a rough size. Nothing is built yet.

**What it takes**
1. **Company orders** (platform, about 4 days). Every order hangs off a subscription today: `orders::create` takes one. A company order is a new kind, one company with many deliveries and no subscription.
2. **An address list** (shop, about 3 days). The company uploads a CSV of names, addresses and delivery days, or types them in. Each postcode is checked against the delivery zones, and the ones we don't reach are flagged before anyone pays.
3. **One invoice** (platform, about 4 days). The invoice job charges a saved card each week. A company gets one Stripe invoice for all its boxes instead, with VAT on each line, to pay within 30 days.
4. **A card in each box** (shop and packing, about 2 days). A message of up to 300 characters goes on the packing list, so that the farm puts a printed card in the box.

**Size:** about three weeks for one person, or two with someone on the platform alongside. Ordering and the card could ship first, paid by card, with invoicing after.

**Before I start**
- Do companies pay by invoice only, or by card as well?
- One box for everyone, or can each person choose theirs?
- Homes only, or the office too?

Reply here to go ahead, or with what to change."""

