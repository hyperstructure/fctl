body = """`billing::invoice::tests::invoices_the_week_of_the_box` failed 3 times in last week's 41 runs on main, and passed each time on a retry. All three were the nightly run, which starts at 23:58 UTC: `invoice_for` and the test read the clock twice, so when midnight fell between the reads, the invoice was issued on one day and the test expected the next.

- `invoice_for` takes `now`, and the invoice job reads the clock once a run, so an invoice issued just after midnight is dated and placed in its week by the same instant.
- The test uses fixed times, and a new one covers a Sunday's last instant and a Monday's first.

The other two tests that needed a retry failed once each: `jobs::tests::retries_back_off` and `routes::tests::plans_two_depots_at_once`. Neither failed again in 50 runs here, so they're left for now."""

