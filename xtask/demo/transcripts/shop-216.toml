output = """     1\timport type { Slot } from "./slots";
     2\t
     3\t/**
     4\t * The free day nearest to `date`: the later one when two are as near,
     5\t * since the earlier may be past its order cutoff by the time someone picks it.
     6\t */
     7\texport function nearestFree(slots: Slot[], date: string): Slot | null {
     8\t  const at = slots.findIndex((s) => s.date === date);
     9\t  if (at < 0) return null;
    10\t  for (let step = 1; step < slots.length; step++) {
    11\t    const later = slots[at + step];
    12\t    if (later && !later.full) return later;
    13\t    const earlier = slots[at - step];
    14\t    if (earlier && !earlier.full) return earlier;
    15\t  }
    16\t  return null;
    17\t}"""

[[turn.step]]
think = "The loop stops at the slots' ends on both sides, and the tests cover a free next day, a free earlier day, a full week and a day that isn't there. Full days are `aria-disabled` rather than `disabled`, so they stay focusable and screen readers still say they're unavailable, and the explanation is a `role=\"status\"`, which they read out when it appears. That's the right trade for something people tap to ask why."

