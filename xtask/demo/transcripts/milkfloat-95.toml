# milkfloat#95 · review of milkfloat#312, Renovate's pyo3 patch release: no issues
match = "Review milkfloat/milkfloat#312, “Update Rust crate pyo3 to v0.28.3”, at commit"

[[turn]]
duration = "22s"
result = "No issues: a patch release of pyo3, and the lockfile moves only pyo3 and its own crates."

[[turn.step]]
tools = [
  { bash = "git log --format='%an: %s' origin/main..HEAD", description = "List the pull request's commits", output = "renovate[bot]: Update Rust crate pyo3 to v0.28.3" },
  { bash = "git diff --stat origin/main...HEAD", description = "See what it changes", output = " Cargo.lock | 20 ++++++++++----------\n Cargo.toml |  2 +-\n 2 files changed, 11 insertions(+), 11 deletions(-)" },
]

[[turn.step]]
bash = "git diff origin/main...HEAD -- Cargo.toml && git diff origin/main...HEAD -- Cargo.lock | grep -B2 '^+version'"
description = "See which crates move"
output = """-pyo3 = { version = "0.28.2", features = ["extension-module"], optional = true }
+pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }
 name = "pyo3"
-version = "0.28.2"
+version = "0.28.3"
--
 name = "pyo3-build-config"
-version = "0.28.2"
+version = "0.28.3"
--
 name = "pyo3-ffi"
-version = "0.28.2"
+version = "0.28.3"
--
 name = "pyo3-macros"
-version = "0.28.2"
+version = "0.28.3"
--
 name = "pyo3-macros-backend"
-version = "0.28.2"
+version = "0.28.3\""""

[[turn.step]]
bash = "fctl review submit /tmp/review.json"
description = "Post the review"
output = "Posted the review on milkfloat/milkfloat#312: no issues.\nhttps://github.com/milkfloat/milkfloat/pull/312#pullrequestreview-2004418"

[[turn.step]]
say = "No issues: a patch release of pyo3, and the lockfile moves only pyo3 and its own crates."
