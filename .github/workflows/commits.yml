# Pull request titles must be Conventional Commits: they become the
# squash-merged commits that `cargo xtask release` makes the version and the
# notes from. Separate from CI, so that editing a title reruns only this.
name: Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: xtask
      - name: The pull request title (it becomes the commit on main)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cargo xtask lint-commit "$TITLE"
      - name: Commits pushed to main
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          cargo xtask lint-commit --range "$BEFORE..$GITHUB_SHA" ||
            echo "::warning::Commits on main should be Conventional Commits; see .claude/skills/commit/SKILL.md"
