# Releases fctl. Start it from main: Actions → Release → Run workflow, or
# `gh workflow run release.yml --ref main -f bump=auto` (see .claude/skills/release).
#
# "Version and notes" picks the next version from the Conventional Commits
# since the last tag (`cargo xtask release`), writes CHANGELOG.md and the
# version, and pushes the release commit and tag to main with
# RELEASE_DEPLOY_KEY, the deploy key that the rulesets on main and on v* tags
# let through (docs/adr/0021). Like any push to main, that starts CI, which
# redeploys app.fctl.sh. The "Build" jobs then cross-compile the release
# binaries, all at once (`cargo xtask dist build`), and "Publish" makes the
# archives from them, makes the GitHub release with the notes and publishes to
# https://fctl.sh/releases. "Standalone image" publishes the control plane
# without Cloudflare, ghcr.io/hyperstructure/fctl-control:<version>. Within
# the hour, hyperstructure/sandbox publishes the release's sandbox image,
# ghcr.io/hyperstructure/sandbox:<version>.
# `tag` rebuilds an existing release tag from main; `dry_run` only shows what
# would ship. Every run starts from main, a dry run too: its jobs use the
# production environment, which only main may use. Tags pushed by hand
# publish nothing: only the deploy key may create v* tags, and starting this
# workflow takes write access to Actions, which agents running in fctl
# sessions do not have.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto follows the commits since the last release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only show the next version and its notes
        type: boolean
        default: false
      tag:
        description: Rebuild this existing tag instead (e.g. v0.1.2)
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # RELEASE_DEPLOY_KEY is a secret of the production environment, which only
    # main may use.
    environment: production
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Over SSH with the deploy key: main's ruleset lets its push below
          # through, and refuses GITHUB_TOKEN's.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: xtask
      - name: Release commit and tag
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run && 'yes' || '' }}
          REBUILD: ${{ inputs.tag }}
        run: |
          if [ -n "$REBUILD" ]; then
            git rev-parse -q --verify "refs/tags/$REBUILD" >/dev/null || { echo "::error::$REBUILD does not exist"; exit 1; }
            git merge-base --is-ancestor "$REBUILD" origin/main || { echo "::error::$REBUILD is not on main"; exit 1; }
            echo "tag=$REBUILD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$DRY_RUN" ]; then
            cargo xtask release --bump "$BUMP" --dry-run
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main (this run is on $GITHUB_REF_NAME)."
            exit 1
          fi
          git config user.name "fctl-sh[bot]"
          git config user.email "343971779+fctl-sh[bot]@users.noreply.github.com"
          cargo xtask release --bump "$BUMP"
          tag=$(git describe --tags --exact-match HEAD)
          # Both or neither: a main that moved meanwhile rejects the push.
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: The tag matches the workspace version
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(git show "$TAG:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          test "v$version" = "$TAG" || { echo "Cargo.toml says $version, the tag is $TAG"; exit 1; }

  build:
    name: Build ${{ matrix.package }} for ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        # Every binary in the archives, each in a job of its own (a test in
        # xtask/src/dist.rs checks the list): the Linux agent for each
        # architecture, which the archives carry for their sandboxes, and fctl
        # for each target.
        include:
          - { package: fctl-agent, target: aarch64-unknown-linux-musl }
          - { package: fctl-agent, target: x86_64-unknown-linux-musl }
          - { package: fctl, target: aarch64-apple-darwin }
          - { package: fctl, target: x86_64-apple-darwin }
          - { package: fctl, target: aarch64-unknown-linux-musl }
          - { package: fctl, target: x86_64-unknown-linux-musl }
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          key: ${{ matrix.package }}-${{ matrix.target }}
      - name: zig and cargo-zigbuild
        run: |
          # cargo-zigbuild finds zig through `python3 -m ziglang`.
          python3 -m pip install --user --break-system-packages ziglang==0.17.0
          # 0.23.4 and the fix that drops rustc's -Wl,-O1, which zig ignores
          # with a warning (rust-cross/cargo-zigbuild#506), until a release has
          # it. Does nothing when the cache has this one.
          cargo install cargo-zigbuild --locked --git https://github.com/rust-cross/cargo-zigbuild \
            --rev 371bac84444fe6f998955889f2106802b817094b
      - name: Build ${{ matrix.package }}
        run: cargo xtask dist build "$PACKAGE" --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.package }}-${{ matrix.target }}
          path: dist/bin/
          if-no-files-found: error
          retention-days: 7
          # A job run again replaces what it built the first time.
          overwrite: true

  # The control plane without Cloudflare (deploy/standalone), for amd64 and
  # arm64: ghcr.io/hyperstructure/fctl-control:<version>, and :<major>.<minor>
  # and :latest when this release is the newest they cover. The Worker and the
  # web app build once, natively; QEMU runs the last stage for arm64.
  image:
    name: Standalone image
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE: ghcr.io/hyperstructure/fctl-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Tags and labels
        id: meta
        run: |
          version=${TAG#v}
          IFS=. read -r major minor _ <<<"$version"
          tags="$IMAGE:$version"
          if [ "$(git tag --list "v$major.$minor.*" --sort=-v:refname | head -1)" = "$TAG" ]; then
            tags="$tags,$IMAGE:$major.$minor"
          fi
          if [ "$(git tag --list 'v*' --sort=-v:refname | head -1)" = "$TAG" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          {
            echo "tags=$tags"
            echo "labels<<EOF"
            echo "org.opencontainers.image.version=$version"
            echo "org.opencontainers.image.revision=$(git rev-parse HEAD)"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing \`${tags//,/\`, \`}\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The Cloudflare token is a secret of the production environment, which
    # only main may use: a workflow on another branch cannot read it.
    environment: production
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: xtask
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: Package the archives
        run: cargo xtask dist package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="dist/$TAG"
          cargo xtask notes "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dir"/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" "$dir"/* --title "fctl ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
      - name: Publish to fctl.sh/releases
        run: cargo xtask publish "$TAG" --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: The installer sees it
        run: |
          test "$(curl -fsS https://fctl.sh/releases/latest)" = "${TAG#v}"
          curl -fsSL https://fctl.sh/install | FCTL_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/bin/fctl" --version
