# Checks every pull request and push, and runs a session through the local
# stack; deploys app.fctl.sh from main (also when started by hand, as the
# Release workflow does after its release commit), and pins fctl.sh
# (hyperstructure/fctl-site) to the new docs when docs/ changed. Pull request
# titles are checked in commits.yml; the standalone control plane's image in
# standalone-image.yml, on pull requests that change it and for each release.
#
# The parts of `cargo xtask check` run at once, each in a job of its own, and
# "cargo xtask check" passes once they all have: that check and "cargo xtask
# dev --smoke" are the ones main's ruleset requires (.github/rulesets). On
# main, what the deploy ships builds beside them, and the deploy waits for
# all three.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in dev and test builds: they build and link in half the
  # time, and their caches are a third of the size. Panics still say where.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    name: Formatting, generated types and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - run: cargo xtask check lint

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - run: cargo xtask check test

  web:
    name: Web app and standalone server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust only for xtask, as in the jobs that build nothing else.
      - uses: ./.github/actions/rust
        with:
          shared-key: xtask
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: cargo xtask check web

  # A skipped job would count as passed, so this one runs whatever the parts
  # did, and fails unless they all passed.
  check:
    name: cargo xtask check
    needs: [lint, test, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "lint: $LINT, test: $TEST, web: $WEB"
          [ "$LINT" = success ] && [ "$TEST" = success ] && [ "$WEB" = success ]

  # Nothing else runs the control plane before it deploys: this applies the
  # migrations to a fresh local D1, starts the Worker, bootstraps an owner,
  # a credential, a runner and a project, and runs one fake-claude session
  # through a host to its commit and a stop.
  dev:
    name: cargo xtask dev --smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # No npm ci: like a fresh clone, cargo xtask dev installs what it needs.
      - run: cargo xtask dev --smoke

  # What the deploy ships, built beside the checks: the web app, the Worker,
  # and xtask, which deploys them. The Worker's release build takes a minute
  # and a half, so it is cached by what it is built from: a push that leaves
  # its crates, the manifests, the toolchain and this workflow as they were
  # deploys the Worker built for the last one that changed them.
  build:
    name: Build app.fctl.sh
    if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || github.head_ref == 'fctl/106-what-kind-of-optimisations-can-we-do-to'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORKER_BUILD: 0.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The Worker, if one was built from the same sources
        id: worker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/fctl-control/build
          key: worker-${{ env.WORKER_BUILD }}-${{ hashFiles('crates/fctl-control/**', 'crates/fctl-domain/**', 'crates/fctl-proto/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
      - uses: ./.github/actions/rust
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace web
      - name: The Worker
        if: steps.worker.outputs.cache-hit != 'true'
        run: |
          command -v worker-build || cargo install worker-build --version "$WORKER_BUILD" --locked
          cd crates/fctl-control && worker-build --release
      - if: steps.worker.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || github.head_ref == 'fctl/106-what-kind-of-optimisations-can-we-do-to')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/fctl-control/build
          key: ${{ steps.worker.outputs.cache-primary-key }}
      # In a tarball, which keeps it executable. It finds the repository where
      # it was built, which is where the deploy checks it out too.
      - name: xtask
        run: |
          cargo build --locked -p xtask
          tar -cf xtask.tar -C target/debug xtask
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app.fctl.sh
          path: |
            crates/fctl-control/build
            web/dist
            xtask.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy app.fctl.sh
    needs: [check, dev, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.fctl.sh
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app.fctl.sh
      - name: Deploy
        run: |
          tar -xf xtask.tar -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/xtask" deploy fctl-sh --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl -fsS https://app.fctl.sh/api/v1/health
          curl -fsS -o /dev/null https://app.fctl.sh/login

  # TEMPORARY, for this pull request only: what deploy does with the
  # artifact, without deploying.
  deploy-dry-run:
    name: Deploy dry run (temporary)
    needs: [check, dev, build]
    if: github.head_ref == 'fctl/106-what-kind-of-optimisations-can-we-do-to'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app.fctl.sh
      - name: Deploy (dry run)
        run: |
          tar -xf xtask.tar -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/xtask" deploy fctl-sh --skip-build --dry-run
          cd crates/fctl-control
          ../../node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/out" --config wrangler.deploy.toml
          ls -la "$RUNNER_TEMP/out"

  site-docs:
    name: Pin fctl.sh to these docs
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # SITE_DEPLOY_KEY pushes to fctl-site's main, which deploys fctl.sh, so it
    # is a secret of the production environment, which only main may use.
    environment: production
    concurrency:
      group: site-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did docs/ change?
        id: docs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- docs; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs.outputs.changed == 'yes'
        uses: ./.github/actions/repo-access
        with:
          repo: fctl-site
          key: ${{ secrets.SITE_DEPLOY_KEY }}
      - name: Pin fctl-docs.ref (fctl-site deploys on the push)
        if: steps.docs.outputs.changed == 'yes'
        run: |
          git clone --quiet --depth 1 git@github-fctl-site:hyperstructure/fctl-site.git "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          echo "$GITHUB_SHA" > fctl-docs.ref
          git add fctl-docs.ref
          git diff --cached --quiet && { echo "already at $GITHUB_SHA"; exit 0; }
          git -c user.name="fctl-sh[bot]" -c user.email="343971779+fctl-sh[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: pin hyperstructure/fctl@${GITHUB_SHA::12}"
          git push --quiet origin HEAD:main || { git pull --quiet --rebase origin main && git push --quiet origin HEAD:main; }
