# Checks every pull request and push; deploys app.fctl.sh from main, and pins
# fctl.sh (hyperstructure/fctl-site) to the new docs when docs/ changed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: cargo xtask check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/repo-access
        with:
          repo: design
          key: ${{ secrets.DESIGN_DEPLOY_KEY }}
      - run: npm ci --no-audit --no-fund
      - run: cargo xtask check

  deploy:
    name: Deploy app.fctl.sh
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.fctl.sh
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/repo-access
        with:
          repo: design
          key: ${{ secrets.DESIGN_DEPLOY_KEY }}
      - run: npm ci --no-audit --no-fund
      - name: worker-build
        run: command -v worker-build || cargo install worker-build --version 0.8.7 --locked
      - name: Deploy
        run: cargo xtask deploy fctl-sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl -fsS https://app.fctl.sh/api/v1/health
          curl -fsS -o /dev/null https://app.fctl.sh/login

  site-docs:
    name: Pin fctl.sh to these docs
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: site-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did docs/ change?
        id: docs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- docs; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs.outputs.changed == 'yes'
        uses: ./.github/actions/repo-access
        with:
          repo: fctl-site
          key: ${{ secrets.SITE_DEPLOY_KEY }}
      - name: Pin fctl-docs.ref (fctl-site deploys on the push)
        if: steps.docs.outputs.changed == 'yes'
        run: |
          git clone --quiet --depth 1 git@github-fctl-site:hyperstructure/fctl-site.git "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          echo "$GITHUB_SHA" > fctl-docs.ref
          git add fctl-docs.ref
          git diff --cached --quiet && { echo "already at $GITHUB_SHA"; exit 0; }
          git -c user.name="fctl-sh[bot]" -c user.email="343971779+fctl-sh[bot]@users.noreply.github.com" \
            commit --quiet -m "Docs: hyperstructure/fctl@${GITHUB_SHA::12}"
          git push --quiet origin HEAD:main || { git pull --quiet --rebase origin main && git push --quiet origin HEAD:main; }
