# Checks every pull request and push, runs a session through the local
# stack, and boots the firecracker driver's microVMs on a runner with KVM;
# on main (also when started by hand), deploys app.fctl.sh and pins
# fctl.sh (hyperstructure/fctl-site) to main's docs when they differ from the
# ones it shows. Pull request titles are checked in commits.yml; the
# standalone control plane's image in standalone-image.yml, on pull requests
# that change it and for each release.
#
# The parts of `cargo xtask check` run at once, each in a job of its own, and
# "cargo xtask check" passes once they all have, and fctl for macOS has
# passed Clippy on a Mac: that check and "cargo xtask
# dev --smoke" are the ones main's ruleset requires (.github/rulesets). The
# jobs run xtask's binary, which .github/actions/xtask takes from a cache when
# nothing it is built from changed. On main, the Worker's release build runs
# beside the checks, and the deploy waits for all of them.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in dev and test builds: they build and link in half the
  # time, and their caches are a third of the size. Panics still say where.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    name: Formatting, generated types and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/xtask
        with:
          setup-rust: false
      - run: xtask check lint

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/xtask
        with:
          setup-rust: false
      - run: xtask check test

  web:
    name: Web app and standalone server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rust only when xtask has to be built.
      - uses: ./.github/actions/xtask
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: xtask check web

  # fctl for macOS, which only the Release workflow built before: code for
  # Linux alone (the firecracker driver's fallocate, O_PATH and nodev) broke
  # v0.30.2's release. Clippy for the host's Mac, its tests included.
  macos:
    name: fctl on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - run: cargo clippy --locked -p fctl -p fctl-host --all-targets -- -D warnings

  # A skipped job would count as passed, so this one runs when a part fails
  # too (unless the run was cancelled), and fails unless they all passed.
  check:
    name: cargo xtask check
    needs: [lint, test, web, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          WEB: ${{ needs.web.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          echo "lint: $LINT, test: $TEST, web: $WEB, macos: $MACOS"
          [ "$LINT" = success ] && [ "$TEST" = success ] && [ "$WEB" = success ] \
            && [ "$MACOS" = success ]

  # Nothing else runs the control plane before it deploys: this applies the
  # migrations to a fresh local D1, starts the Worker, bootstraps an owner,
  # a credential, a runner and a project, and runs one fake-claude session
  # through a host to its commit and a stop. The tools worker-build downloads
  # to build the Worker (wasm-bindgen from GitHub's release downloads) come
  # from a cache, so that GitHub's downloads failing doesn't fail it (#487):
  # it downloads them into it when it has none, and only main saves it.
  dev:
    name: cargo xtask dev --smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/xtask
        with:
          setup-rust: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/worker-build
        id: worker-build
        with:
          profile: dev
      # No npm ci: like a fresh clone, cargo xtask dev installs what it needs.
      - run: xtask dev --smoke
      - name: Save worker-build's tools
        if: steps.worker-build.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/worker-build
          key: ${{ steps.worker-build.outputs.key }}

  # The firecracker driver's tests that boot microVMs (`--ignored` ones in
  # crates/fctl-host/src/driver/firecracker), which need KVM: GitHub's x86_64
  # runners have it, for root only. They pull an image from Docker Hub, the
  # kernel hosts pull and Firecracker's release, and run passt under the
  # AppArmor profile Ubuntu gives it. Firecracker and the kernel come from a
  # cache, keyed on the ones assets.rs pins, so that fewer downloads can
  # fail: the tests download them into it when it has none (only main saves
  # it), and give each test's host a copy, where it would have downloaded
  # them itself.
  firecracker:
    name: Firecracker sandboxes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - name: KVM for the runner's user, passt and a static fctl-agent
        run: |
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends passt e2fsprogs
          # What confines passt, which runs as the host's user.
          sudo aa-status 2>/dev/null | grep -i passt || echo "No AppArmor profile confines passt"
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p fctl-agent --target x86_64-unknown-linux-musl
      - name: The Firecracker and kernel the host pins
        id: pinned
        run: |
          assets=crates/fctl-host/src/driver/firecracker/assets.rs
          firecracker=$(sed -n 's/^pub const FIRECRACKER_VERSION: &str = "\(.*\)";$/\1/p' "$assets")
          kernel=$(sed -n 's/^pub const KERNEL_IMAGE: &str = "\(.*\)";$/\1/p' "$assets")
          # Each on its own: bash -e stops at neither of `a && b` but the last.
          test -n "$firecracker"
          test -n "$kernel"
          echo "Firecracker $firecracker, kernel $kernel"
          echo "key=firecracker-$firecracker-kernel-${kernel//[\/:]/-}" >> "$GITHUB_OUTPUT"
      - name: Firecracker and the kernel from the cache
        id: vm-assets
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vm-assets
          key: ${{ steps.pinned.outputs.key }}
      - name: Boot sandboxes
        env:
          FCTL_TEST_FIRECRACKER_AGENT: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/fctl-agent
          FCTL_TEST_FIRECRACKER_ASSETS: ${{ runner.temp }}/vm-assets
        run: |
          cargo test --locked -p fctl-host --lib driver::firecracker:: -- --ignored --nocapture --test-threads 1
      - name: Boot sandboxes on a host that runs as root
        env:
          FCTL_TEST_FIRECRACKER_AGENT: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/fctl-agent
          FCTL_TEST_FIRECRACKER_ASSETS: ${{ runner.temp }}/vm-assets
        run: |
          bin=$(CARGO_TERM_COLOR=never cargo test --locked -p fctl-host --lib --no-run 2>&1 | sed -n 's/.*Executable unittests src\/lib.rs (\(.*\))/\1/p')
          test -x "$bin"
          sudo env "FCTL_TEST_FIRECRACKER_AGENT=$FCTL_TEST_FIRECRACKER_AGENT" "FCTL_TEST_FIRECRACKER_DATA=$RUNNER_TEMP/root" \
            "FCTL_TEST_FIRECRACKER_ASSETS=$FCTL_TEST_FIRECRACKER_ASSETS" \
            "$bin" driver::firecracker::tests::boots_a_sandbox driver::firecracker::tests::sandboxes_of_a_project_share_its_package_caches \
            driver::firecracker::tests::stopped_sandboxes_resume_where_they_were \
            --ignored --nocapture --test-threads 1
          # Jails lend disks and saved states to their users, which only root can.
          sudo "$bin" driver::firecracker::vm::tests::stale_jails_go \
            driver::firecracker::vm::tests::a_jailed_vms_state_is_saved_and_resumed_through_its_jail \
            --exact --nocapture --test-threads 1
      - name: Save Firecracker and the kernel
        if: steps.vm-assets.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vm-assets
          key: ${{ steps.vm-assets.outputs.cache-primary-key }}
      # Whiteouts kept as overlayfs reads them, for images that lie over
      # others, need root, which the VMs' init is.
      - name: Unpack layers as root
        run: |
          bin=$(CARGO_TERM_COLOR=never cargo test --locked -p fctl-agent --bin fctl-agent --no-run 2>&1 | sed -n 's/.*Executable unittests src\/main.rs (\(.*\))/\1/p')
          test -x "$bin"
          sudo env FCTL_TEST_WHITEOUTS=1 "$bin" vm::unpack --nocapture

  # The Worker the deploy ships, built beside the checks. Its release build
  # takes two minutes, so it is cached by what it is built from: a push that
  # leaves its crates, the manifests, the toolchain and this workflow as they
  # were deploys the Worker built for an earlier one. worker-build's tools
  # come from a cache too, as in cargo xtask dev --smoke.
  worker:
    name: Build the Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORKER_BUILD: 0.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The Worker, if one was built from the same files
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/fctl-control/build
          key: worker-${{ env.WORKER_BUILD }}-${{ hashFiles('crates/fctl-control/**', 'crates/fctl-domain/**', 'crates/fctl-proto/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/ci.yml') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/rust
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/worker-build
        id: worker-build
        with:
          profile: release
      - name: Build it
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          command -v worker-build || cargo install worker-build --version "$WORKER_BUILD" --locked
          cd crates/fctl-control && worker-build --release
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/fctl-control/build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Save worker-build's tools
        if: steps.cache.outputs.cache-hit != 'true' && steps.worker-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/worker-build
          key: ${{ steps.worker-build.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker
          path: crates/fctl-control/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy app.fctl.sh
    needs: [check, dev, worker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.fctl.sh
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # From the cache, where the checks' jobs left it for this commit.
      - uses: ./.github/actions/xtask
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker
          path: crates/fctl-control/build
      - name: Deploy
        run: xtask deploy fctl-sh --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          curl -fsS https://app.fctl.sh/api/v1/health
          curl -fsS -o /dev/null https://app.fctl.sh/login

  # fctl.sh shows the docs at the commit in fctl-site's fctl-docs.ref. Once
  # the checks pass, this pins main's commit there if its docs/ differ from
  # that commit's. It compares with the pin, not with the commit before the
  # push, so that the docs of a push whose checks failed reach fctl.sh with
  # the next run that passes, not with the next push that changes docs/. And
  # it never pins a commit older than the pinned one, for runs that finish
  # out of order: an old commit's run started again, or checks that took
  # longer than a newer push's.
  site-docs:
    name: Pin fctl.sh to these docs
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # SITE_DEPLOY_KEY pushes to fctl-site's main, which deploys fctl.sh, so it
    # is a secret of the production environment, which only main may use.
    environment: production
    concurrency:
      group: site-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # fctl-site is public: reading its pin takes no key, only pushing one
      # does. A new pin is committed on this clone, over the pin it was
      # compared with.
      - name: Are fctl.sh's docs behind these?
        id: docs
        run: |
          git clone --quiet --depth 1 https://github.com/hyperstructure/fctl-site.git "$RUNNER_TEMP/site"
          pinned=$(tr -d '[:space:]' < "$RUNNER_TEMP/site/fctl-docs.ref")
          if ! [[ $pinned =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$pinned^{commit}" 2>/dev/null; then
            echo "fctl-docs.ref says '$pinned', not the full hash of a commit of this repository: pinning ${GITHUB_SHA::12}"
            echo "pin=yes" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor HEAD "$pinned"; then
            echo "fctl.sh shows the docs at ${pinned::12}, this commit or a newer one"
            echo "pin=no" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$pinned" HEAD -- docs; then
            echo "fctl.sh shows the docs at ${pinned::12}, which are the same as these"
            echo "pin=no" >> "$GITHUB_OUTPUT"
          else
            echo "fctl.sh shows the docs at ${pinned::12}, which differ from these: pinning ${GITHUB_SHA::12}"
            echo "pin=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs.outputs.pin == 'yes'
        uses: ./.github/actions/repo-access
        with:
          repo: fctl-site
          key: ${{ secrets.SITE_DEPLOY_KEY }}
      - name: Pin fctl-docs.ref (fctl-site deploys on the push)
        if: steps.docs.outputs.pin == 'yes'
        run: |
          cd "$RUNNER_TEMP/site"
          git remote set-url origin git@github-fctl-site:hyperstructure/fctl-site.git
          echo "$GITHUB_SHA" > fctl-docs.ref
          git add fctl-docs.ref
          git -c user.name="fctl-sh[bot]" -c user.email="343971779+fctl-sh[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: pin hyperstructure/fctl@${GITHUB_SHA::12}"
          git push --quiet origin HEAD:main || { git pull --quiet --rebase origin main && git push --quiet origin HEAD:main; }
