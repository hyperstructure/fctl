# Publishes the default sandbox image, images/agent, for arm64 and amd64 as
# ghcr.io/hyperstructure/fctl-agent:<version>, :<major>.<minor> and :latest
# (docs/sandbox-images.md). Each release gets its own: built from the
# release's tag, with that release of fctl and the newest Claude Code.
#
# - The Release workflow starts it for every release.
# - Every day it rebuilds the latest release's image when Claude Code has a
#   newer release than the one inside, or when the image is a week old (for
#   Debian's updates): fctl turns off Claude Code's auto-updater, so an
#   image's Claude Code is as old as the image.
# - `gh workflow run image.yml -f tag=v0.2.1 -f force=true` rebuilds one.
# - Pull requests that change the image build it without publishing.
#
# Each architecture builds on its own runner and is pushed by digest, without
# a tag, then checked with images/agent/check.sh; the last job tags the two
# as one image. Moving tags move only to the newest release they cover.
name: Image

on:
  pull_request:
    paths:
      - images/agent/**
      - .github/workflows/image.yml
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: The release to build, like v0.2.1 (default the latest)
        required: false
      force:
        description: Build even when the published image is current
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hyperstructure/fctl-agent

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      claude: ${{ steps.plan.outputs.claude }}
      tags: ${{ steps.plan.outputs.tags }}
      created: ${{ steps.plan.outputs.created }}
      build: ${{ steps.plan.outputs.build }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Versions and tags
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force && 'yes' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          latest=$(curl -fsS --retry 3 https://fctl.sh/releases/latest | tr -d '[:space:]')
          [[ $latest =~ $semver ]] || { echo "::error::fctl.sh/releases/latest says '$latest'"; exit 1; }
          # What https://claude.ai/install.sh installs; every architecture gets this one.
          claude=$(curl -fsS --retry 3 https://downloads.claude.ai/claude-code-releases/latest | tr -d '[:space:]')
          [[ $claude =~ $semver ]] || { echo "::error::downloads.claude.ai says the latest Claude Code is '$claude'"; exit 1; }

          if [ "$EVENT" = pull_request ]; then
            # This change's images/agent with the latest fctl; nothing is pushed.
            ref=$GITHUB_SHA version=$latest push=no
          else
            tag=${TAG:-$latest} tag=v${tag#v}
            [[ ${tag#v} =~ $semver ]] || { echo "::error::$tag is not a release tag like v0.2.1"; exit 1; }
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "::error::there is no tag $tag"; exit 1; }
            ref=$tag version=${tag#v} push=yes
          fi

          minor=${version%.*}
          newest_minor=$({ git tag -l "v$minor.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          tags="$IMAGE:$version"
          if [ "$newest_minor" = "v$version" ]; then tags="$tags $IMAGE:$minor"; fi
          if [ "$version" = "$latest" ]; then tags="$tags $IMAGE:latest"; fi

          build=yes why="fctl $version with Claude Code $claude"
          if [ "$push" = yes ] && [ -z "$FORCE" ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            if index=$(docker buildx imagetools inspect --raw "$IMAGE:$version" 2>/dev/null); then
              have=$(jq -r '.annotations["sh.fctl.claude-code.version"] // ""' <<<"$index")
              built=$(jq -r '.annotations["org.opencontainers.image.created"] // "1970-01-01"' <<<"$index")
              age=$(( ($(date +%s) - $(date -d "$built" +%s 2>/dev/null || echo 0)) / 86400 ))
              if [ "$have" = "$claude" ] && [ "$age" -lt 7 ]; then
                build=no why="$IMAGE:$version already has Claude Code $claude and is $age days old"
              fi
            fi
          fi

          {
            echo "ref=$ref"
            echo "version=$version"
            echo "claude=$claude"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build=$build"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$build" = no ]; then
              echo "Nothing to build: $why."
            elif [ "$push" = yes ]; then
              echo "Building $why from \`$ref\` for $tags."
            else
              echo "Building $why from this pull request, without publishing it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.build == 'yes'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ needs.plan.outputs.ref }}
      VERSION: ${{ needs.plan.outputs.version }}
      CLAUDE: ${{ needs.plan.outputs.claude }}
      CREATED: ${{ needs.plan.outputs.created }}
      PUSH: ${{ needs.plan.outputs.push }}
    steps:
      # This workflow's commit, for check.sh, and the image's sources at the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: release
      - name: Build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx create --name fctl --driver docker-container --use >/dev/null
          if [ "$PUSH" = yes ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            output="type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true"
          else
            output="type=docker,name=fctl-agent:check"
          fi
          docker buildx build release/images/agent \
            --platform "linux/$ARCH" --pull --provenance=false \
            --build-arg "FCTL_VERSION=$VERSION" \
            --build-arg "CLAUDE_VERSION=$CLAUDE" \
            --label "org.opencontainers.image.title=fctl-agent" \
            --label "org.opencontainers.image.description=The default sandbox for fctl sessions" \
            --label "org.opencontainers.image.url=https://fctl.sh/docs/sandbox-images/" \
            --label "org.opencontainers.image.source=https://github.com/hyperstructure/fctl" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$(git -C release rev-parse HEAD)" \
            --label "org.opencontainers.image.created=$CREATED" \
            --label "sh.fctl.version=$VERSION" \
            --label "sh.fctl.claude-code.version=$CLAUDE" \
            --output "$output" \
            --metadata-file "$RUNNER_TEMP/build.json"
          if [ "$PUSH" = yes ]; then
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          else
            echo "image=fctl-agent:check" >> "$GITHUB_OUTPUT"
          fi
      - name: Check it
        env:
          CHECK: ${{ steps.build.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -i -e FCTL_VERSION="$VERSION" -e CLAUDE_VERSION="$CLAUDE" "$CHECK" sh -s < images/agent/check.sh
          docker image inspect --format '{{.Size}}' "$CHECK" |
            awk -v arch="$ARCH" '{ printf "%s: %.2f GB\n", arch, $1 / 1e9 }' >> "$GITHUB_STEP_SUMMARY"
      - name: Note its digest
        if: needs.plan.outputs.push == 'yes'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: needs.plan.outputs.push == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [plan, build]
    if: needs.plan.outputs.push == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CLAUDE: ${{ needs.plan.outputs.claude }}
      CREATED: ${{ needs.plan.outputs.created }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Tag both architectures as one image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$file")"); done
          [ "${#sources[@]}" = 2 ] || { echo "::error::expected a digest for each architecture, got ${sources[*]}"; exit 1; }
          tags=()
          for tag in $TAGS; do tags+=(--tag "$tag"); done
          # On the index too: GHCR shows these, and the daily run reads the
          # Claude Code version and the date from them.
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=The default sandbox for fctl sessions" \
            --annotation "index:org.opencontainers.image.source=https://github.com/hyperstructure/fctl" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:sh.fctl.claude-code.version=$CLAUDE" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo "Published fctl $VERSION with Claude Code $CLAUDE as:"
            for tag in $TAGS; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
