# Temporary, for this branch only (removed before it is merged): runs the
# Release workflow's Build jobs on this branch with warnings denied, packages
# their binaries, and compares the archives with the v0.3.0 release's, which
# the old workflow built from the same code. Publishes nothing.
name: Release build check

on:
  push:
    branches: [fctl/20-there-s-a-small-warning-when-fctl-is-bui]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.package }} for ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { package: fctl-agent, target: aarch64-unknown-linux-musl }
          - { package: fctl-agent, target: x86_64-unknown-linux-musl }
          - { package: fctl, target: aarch64-apple-darwin }
          - { package: fctl, target: x86_64-apple-darwin }
          - { package: fctl, target: aarch64-unknown-linux-musl }
          - { package: fctl, target: x86_64-unknown-linux-musl }
    env:
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
          key: ${{ matrix.package }}-${{ matrix.target }}
          # Branch caches serve no one else.
          save-if: false
      - name: zig and cargo-zigbuild
        run: |
          python3 -m pip install --user --break-system-packages ziglang==0.17.0
          cargo install cargo-zigbuild --locked --git https://github.com/rust-cross/cargo-zigbuild \
            --rev 371bac84444fe6f998955889f2106802b817094b
      - name: Build ${{ matrix.package }}, failing on any warning
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo xtask dist build "$PACKAGE" --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.package }}-${{ matrix.target }}
          path: dist/bin/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  package:
    name: Package and compare with v0.3.0
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: xtask
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - name: Package the archives
        run: cargo xtask dist package
      - name: The archives are v0.3.0's
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist/bin/v0.3.0 dist/v0.3.0
          # The Release workflow may still be publishing v0.3.0.
          until gh release view v0.3.0 --json isDraft,assets \
            --jq '.isDraft == false and any(.assets[]; .name == "manifest.json")' | grep -qx true; do
            sleep 30
          done
          gh release download v0.3.0 -D "$RUNNER_TEMP/v0.3.0"
          python3 -I .github/release-build-check.py "$RUNNER_TEMP/v0.3.0" dist/v0.3.0
