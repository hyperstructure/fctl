name: Rust
description: >
  The toolchain rust-toolchain.toml pins, alone, and Swatinem/rust-cache for
  the job's dependencies. The toolchain comes from a cache, which takes a few
  seconds where rustup takes ten. The runner image's own toolchains go:
  rust-cache's keys hash every installed one, so the image's updates would
  start the caches over, and two images in use at once would keep two of
  each. Only main saves caches; pull requests restore main's, so that theirs
  don't push main's out of the repository's 10 GB.
inputs:
  shared-key:
    description: Share the dependency cache with the jobs that give the same key (they build the same), instead of keeping one for this job
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: The toolchain from the cache
      id: toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains
          ~/.rustup/update-hashes
        key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
    - name: Only the toolchain rust-toolchain.toml pins
      shell: bash
      run: |
        pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        rustup toolchain install --no-self-update
        rustup default "$pinned"
        for toolchain in $(rustup toolchain list --quiet); do
          case "$toolchain" in
            "$pinned"-*) ;;
            *) rustup toolchain uninstall "$toolchain" ;;
          esac
        done
    - name: Save the toolchain
      if: steps.toolchain.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || github.head_ref == 'fctl/106-what-kind-of-optimisations-can-we-do-to')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.rustup/toolchains
          ~/.rustup/update-hashes
        key: ${{ steps.toolchain.outputs.cache-primary-key }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'fctl/106-what-kind-of-optimisations-can-we-do-to' }}
