# Local development configuration (`cargo xtask dev`, `wrangler dev`).
# Deployments render their own config from deploy/instances/<name>.toml.
# The standalone control plane (deploy/standalone) runs with the bindings
# here, and its own [vars]. Its state's files are named after `name` and the
# D1 `database_id`, so keep both as they are.
name = "fctl-control"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --dev"

[assets]
directory = "../../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fctl-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "SESSION", class_name = "SessionObject" },
  { name = "FLEET", class_name = "FleetObject" },
  { name = "FILES", class_name = "FilesObject" },
  { name = "NOTIFY", class_name = "NotifyObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionObject", "FleetObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FilesObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["NotifyObject"]

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
FCTL_INSTANCE_NAME = "fctl dev"
FCTL_PUBLIC_URL = "http://localhost:8787"
FCTL_DEV = "1"

# Hourly housekeeping (src/housekeeping.rs). `cargo xtask dev` runs wrangler
# with --test-scheduled: curl "http://127.0.0.1:8787/cdn-cgi/handler/scheduled?cron=17+*+*+*+*"
[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
