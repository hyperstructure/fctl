[package]
name = "fctl-agent"
description = "The fctl supervisor that runs Claude Code inside a sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fctl-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
fctl-domain.workspace = true
fctl-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The init of Firecracker microVMs (src/vm).
[target.'cfg(target_os = "linux")'.dependencies]
flate2.workspace = true
nix = { workspace = true, features = ["hostname", "mount", "net", "reboot", "resource", "socket", "time"] }
tar.workspace = true
tokio-tun = "0.15.2"
tokio-vsock = "0.7.2"
vsock = "0.5.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
