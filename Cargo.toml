[workspace]
resolver = "3"
members = [
    "crates/fctl-proto",
    "crates/fctl-domain",
    "crates/fctl-control",
    "crates/fctl-client",
    "crates/fctl-host",
    "crates/fctl-agent",
    "crates/fctl",
    "crates/fake-claude",
    "xtask",
]
# fctl-control only builds for wasm32-unknown-unknown; `cargo xtask` builds it.
default-members = [
    "crates/fctl-proto",
    "crates/fctl-domain",
    "crates/fctl-client",
    "crates/fctl-host",
    "crates/fctl-agent",
    "crates/fctl",
    "crates/fake-claude",
    "xtask",
]

[workspace.package]
version = "0.20.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hyperstructure/fctl"
homepage = "https://fctl.sh"
authors = ["The fctl authors"]

[workspace.dependencies]
fctl-proto = { path = "crates/fctl-proto" }
fctl-domain = { path = "crates/fctl-domain" }
fctl-host = { path = "crates/fctl-host" }
fctl-client = { path = "crates/fctl-client" }

aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
flate2 = "1.1.10"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "webpki-roots", "http1", "http2", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
libc = "0.2.191"
nix = { version = "0.31.3", features = ["signal", "process", "fs", "term", "user"] }
qrcode = { version = "0.14.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3", default-features = false, features = ["macros"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tempfile = "3.27.0"
regex = "1.13.1"
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
url = "2.5.8"
webpki-roots = "1.0.9"
rustls-pki-types = { version = "1", features = ["std"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Protocol messages are moved, not stored in bulk; boxing them is noise.
large_enum_variant = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# wasm-bindgen needs the Worker's symbols (worker-build runs wasm-opt after it).
[profile.release.package.fctl-control]
strip = "none"

# Release archives (`cargo xtask dist`). Panics unwind: the host daemon and
# the agent supervisor survive a panicking task.
[profile.dist]
inherits = "release"
lto = "fat"
