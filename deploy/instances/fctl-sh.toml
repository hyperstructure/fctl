# The hyperstructure instance at https://app.fctl.sh.
#
# Deploy with `cargo xtask deploy fctl-sh`. Nothing in this file is secret:
# secrets live in the Worker (see `cargo xtask secrets fctl-sh`).

# The Worker's name in the Cloudflare account.
worker = "fctl"
# Shown in the app's title bar and in emails.
instance_name = "fctl"
# The app's origin. Its host becomes the Worker's custom domain.
public_url = "https://app.fctl.sh"
# The sign-in page lets people without an account ask for early access, and
# admins invite them from Admin → Early access.
early_access = true
# Search engines may index the sign-in and early access pages: /robots.txt
# lets them, and /sitemap.xml lists them.
search_engines = true

[d1]
database_name = "fctl-sh"
database_id = "e84e35ee-6755-4bff-a1ff-ba2539406ba0"

[github]
app_id = "5357932"
app_slug = "fctl-sh"
client_id = "Iv23liRKQScqi5ySeiBr"
# Where "New repository" creates repositories.
default_owner = "hyperstructure"

# fctl's Linear app, which workspaces install in their Linear workspaces
# (LINEAR_CLIENT_SECRET and LINEAR_WEBHOOK_SECRET are Worker secrets). Until
# its client ID is here, LINEAR_CLIENT_ID can be a secret too.
# [linear]
# client_id = ""

# "Sign in with Google": the OAuth client in the fctl-sh Google Cloud project
# (GOOGLE_CLIENT_SECRET is a Worker secret).
[google]
client_id = "940932092920-siou1a3hvqfl6p1s39lgr93iodpoaflo.apps.googleusercontent.com"

[email]
from = "fctl <noreply@fctl.sh>"
